<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081d25">
  <title>Acesso à conta · Kaizoku Idle</title>
  <link rel="stylesheet" href="/online/login.css">
  <script defer src="/online/login.js"></script>
</head>
<body>
  <main class="harbor">
    <hgroup class="identity">
      <h1>
        <img src="./art/kaizoku-idle.webp" alt="Kaizoku Idle" width="1000" height="391" fetchpriority="high">
        <svg class="logo-voyage" viewBox="0 0 1000 391" aria-hidden="true" focusable="false">
          <defs>
            <!-- Clockwise around the brim, crown, lettering, right-hand rope and IDLE plaque. -->
            <path id="logo-coast" pathLength="100" d="
              M 16 147
              C 15 139 38 120 53 107 Q 59 102 55 90
              C 47 47 87 2 130 -5 Q 166 -12 191 17 Q 196 24 203 22
              C 225 10 246 5 253 16 Q 261 26 246 42
              Q 237 54 251 53 L 298 53 Q 318 53 327 66
              Q 334 76 335 63 Q 336 51 348 51 L 487 51
              Q 502 51 511 47 Q 531 38 547 57
              Q 552 61 560 55 Q 606 24 652 54 Q 660 61 668 53
              Q 681 43 699 52 L 739 52 Q 751 52 751 72
              Q 751 81 758 65 Q 764 51 777 51 L 937 51
              Q 955 51 955 68 L 955 186 Q 955 193 964 199
              C 1002 227 998 274 967 291 Q 944 305 915 292
              Q 908 288 899 297 C 858 343 793 333 755 294
              Q 743 280 742 296 L 741 315 Q 740 323 730 327
              Q 720 334 737 336 Q 748 338 747 350 L 746 373
              Q 745 393 725 393 L 517 393 Q 497 393 493 382
              Q 490 375 482 383 Q 473 393 459 393 L 284 393
              Q 259 393 259 375 L 260 351 Q 260 335 274 333
              Q 282 332 280 319 L 279 307 Q 277 291 264 301
              C 223 341 157 339 128 300 Q 123 292 111 296
              C 60 310 25 277 34 235 Q 40 208 65 195
              Q 71 192 71 181 L 71 151 Q 71 143 60 149
              C 42 157 18 166 16 147 Z"/>
          </defs>
          <use href="#logo-coast" class="voyage-wake" stroke-dasharray="2.5 97.5">
            <animate attributeName="stroke-dashoffset" values="2.5;-97.5" dur="24s" repeatCount="indefinite"/>
          </use>
          <g class="voyage-ship">
            <animateMotion dur="24s" rotate="auto" repeatCount="indefinite"><mpath href="#logo-coast"/></animateMotion>
            <g class="ship-art" stroke-linejoin="round">
              <path d="M-22 -8 Q-1 -17 27 0 Q3 17 -22 8 Q-26 0 -22 -8Z" fill="#864221" stroke="#39261e" stroke-width="3"/>
              <path d="M-19 -6 Q1 -13 23 0 Q2 12 -19 6Z" fill="#cc9149" stroke="#f2c878" stroke-width="2"/>
              <path d="M-12 -9 Q-4 -1 -12 9 Q2 10 7 2 Q5 -6 -12 -9Z" fill="#f5dfaa" stroke="#614631" stroke-width="1.6"/>
              <path d="M-3 -12 Q4 -1 -3 12 Q14 10 16 1 Q14 -8 -3 -12Z" fill="#fff1c8" stroke="#614631" stroke-width="1.6"/>
              <path d="M0 -10 Q2 0 0 10" fill="none" stroke="#d3b57e" stroke-width="1.5"/>
              <path d="M4 0 L-8 -3 -16 1 -7 3Z" fill="#bd4638" stroke="#653121"/>
            </g>
          </g>
        </svg>
      </h1>
      <p class="game-intro">
        <strong>Do Porto das Correntes à&nbsp;Ilha Dawn</strong>
        A Patrulha de Dawn paga em Berry por seis inimigos derrotados. Na volta, leve sua arma à forja.
      </p>
    </hgroup>
    <section id="account" aria-labelledby="panel-title">
      <h2 id="panel-title">Entrar no jogo</h2>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="login-view">
        <nav class="modes" aria-label="Acesso à conta">
          <button type="button" data-mode="login" aria-pressed="true">Entrar</button>
          <button type="button" data-mode="signup" aria-pressed="false">Criar conta</button>
        </nav>
        <form id="login-form">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="voce@exemplo.com" required>
          <div id="password-field">
            <div class="password-label">
              <label for="password">Senha</label>
              <button type="button" class="recover" data-mode="recover" aria-pressed="false">Recuperar acesso</button>
            </div>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" aria-describedby="password-hint" required>
            <small id="password-hint">Use pelo menos 12 caracteres.</small>
          </div>
          <button id="login-submit" class="primary" type="submit">Entrar no jogo</button>
        </form>
      </div>
      <form id="create-form" hidden><p>Escolha seu primeiro personagem. A conta permite um personagem.</p><label for="name">Nome</label><input id="name" maxlength="40" required><label for="class">Classe</label><select id="class"><option value="sword">Espadachim</option><option value="brawler">Lutador</option><option value="gunner">Atirador</option><option value="rogue">Gatuno</option><option value="cyborg">Ciborgue</option><option value="strategist">Estrategista</option><option value="healer">Curandeiro</option></select><label for="faction">Facção</label><select id="faction"><option value="pirate">Pirata</option><option value="marine">Marinha</option><option value="revolutionary">Revolucionário</option><option value="government">Governo</option></select><button class="primary" type="submit">Criar personagem e jogar</button></form>
<form id="reset-form" hidden><label for="new-password">Nova senha</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button class="primary" type="submit">Salvar nova senha</button></form>
      <nav class="community" aria-label="Comunidade Kaizoku Idle">
        <span class="community-heading">Comunidade</span>
        <a href="https://discord.gg/uRnP79cp7h" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 5.1a16 16 0 0 0-4-1.2l-.5 1a15 15 0 0 0-4.8 0l-.5-1a16 16 0 0 0-4 1.2C2.6 8.8 1.7 12.4 2 16a16 16 0 0 0 4.9 2.5l1.2-1.7-1.7-.8.4-.3a13.4 13.4 0 0 0 10.4 0l.4.3-1.7.8 1.2 1.7A16 16 0 0 0 22 16c.3-3.6-.6-7.2-3.1-10.9ZM8.6 14.4c-.9 0-1.6-.8-1.6-1.9s.7-1.9 1.6-1.9 1.6.8 1.6 1.9-.7 1.9-1.6 1.9Zm6.8 0c-.9 0-1.6-.8-1.6-1.9s.7-1.9 1.6-1.9 1.6.8 1.6 1.9-.7 1.9-1.6 1.9Z"/></svg>Discord
        </a>
        <a href="https://www.instagram.com/kaizokuidle2d" target="_blank" rel="noopener noreferrer">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>Instagram
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
