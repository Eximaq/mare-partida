<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2F6F8"/>
      <stop offset="0.5" stop-color="#B4C2C8"/>
      <stop offset="1" stop-color="#7A8C94"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#E7B64C"/>
      <stop offset="1" stop-color="#A8701F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98349"/>
      <stop offset="1" stop-color="#6B3A1D"/>
    </linearGradient>
    <g id="sword">
      <!-- guarda em concha -->
      <path d="M-26 50 C-40 86 -22 106 0 106" fill="none" stroke="#24160B" stroke-width="13" stroke-linecap="round"/>
      <path d="M-26 50 C-40 86 -22 106 0 106" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <!-- lamina curva -->
      <path d="M-9 40 C-14 -8 -6 -64 20 -108 C21 -62 15 -10 10 40 Z" fill="url(#steel)" stroke="#24160B" stroke-width="7" stroke-linejoin="round"/>
      <path d="M-1 34 C-4 -8 2 -54 15 -90" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
      <!-- empunhadura -->
      <rect x="-7" y="50" width="14" height="44" rx="4" fill="url(#wood)" stroke="#24160B" stroke-width="6"/>
      <path d="M-7 62 H7 M-7 74 H7 M-7 86 H7" stroke="#24160B" stroke-width="3" opacity="0.6"/>
      <!-- guarda reta -->
      <rect x="-30" y="38" width="60" height="12" rx="6" fill="url(#gold)" stroke="#24160B" stroke-width="6"/>
      <!-- pomo -->
      <circle cx="0" cy="102" r="10" fill="url(#gold)" stroke="#24160B" stroke-width="6"/>
    </g>
  </defs>

  <use href="#sword" transform="translate(128 134) rotate(-47) scale(-1.14 1.14)"/>
  <use href="#sword" transform="translate(128 134) rotate(47) scale(1.14)"/>
</svg>
