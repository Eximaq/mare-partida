<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="240" rx="80" ry="7" fill="#000000" opacity="0.22"/>

  <!-- boia: base branca e gomos vermelhos -->
  <circle cx="128" cy="128" r="75" fill="none" stroke="#FFF4E0" stroke-width="50"/>
  <circle cx="128" cy="128" r="75" fill="none" stroke="#E5513D" stroke-width="50" stroke-dasharray="58.9 58.9" transform="rotate(-22.5 128 128)"/>
  <circle cx="128" cy="128" r="75" fill="none" stroke="url(#shade)" stroke-width="50"/>

  <!-- contornos -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#24160B" stroke-width="7"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#24160B" stroke-width="7"/>

  <!-- brilho -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 462.9" transform="rotate(-135 128 128)" opacity="0.4"/>
</svg>
