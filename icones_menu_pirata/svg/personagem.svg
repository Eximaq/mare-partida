  <circle cx="166" cy="126" r="9" fill="#E5AE7C" stroke="#24160B" stroke-width="5"/>
  <ellipse cx="128" cy="122" rx="38" ry="42" fill="url(#skin)" stroke="#24160B" stroke-width="6"/>

  <!-- barba -->
  <path d="M91 136 C93 168 108 186 128 188 C148 186 163 168 165 136 C156 154 142 160 128 158 C114 160 100 154 91 136 Z" fill="#5A3319" stroke="#24160B" stroke-width="5" stroke-linejoin="round"/>
  <path d="M104 154 C112 142 124 146 128 152 C132 146 144 142 152 154 C142 158 132 156 128 154 C124 156 114 158 104 154 Z" fill="#5A3319" stroke="#24160B" stroke-width="3.5" stroke-linejoin="round"/>
