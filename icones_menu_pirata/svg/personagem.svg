  <rect x="174" y="200" width="36" height="13" rx="6.5" fill="url(#gold)" stroke="#24160B" stroke-width="4" transform="rotate(18 192 206)"/>
  <circle cx="114" cy="232" r="5" fill="url(#gold)" stroke="#24160B" stroke-width="3"/>
  <circle cx="142" cy="232" r="5" fill="url(#gold)" stroke="#24160B" stroke-width="3"/>

