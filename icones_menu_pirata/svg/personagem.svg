<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7CFA3"/>
      <stop offset="1" stop-color="#D79C69"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A86A6"/>
      <stop offset="1" stop-color="#23495C"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4C70"/>
      <stop offset="1" stop-color="#1D1E31"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#E7B64C"/>
      <stop offset="1" stop-color="#A8701F"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A32616"/>
      <stop offset="1" stop-color="#F0614B"/>
    </linearGradient>
  </defs>

  <!-- pescoco -->
  <path d="M110 150 H146 V184 Q128 196 110 184 Z" fill="#C98F5E" stroke="#24160B" stroke-width="6" stroke-linejoin="round"/>

