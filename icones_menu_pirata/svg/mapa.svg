<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.5" stop-color="#E7B64C"/>
      <stop offset="1" stop-color="#A8701F"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#3AA3A8"/>
      <stop offset="1" stop-color="#0F3F4B"/>
    </radialGradient>
  </defs>

  <!-- aro externo -->
  <circle cx="128" cy="128" r="104" fill="url(#gold)" stroke="#24160B" stroke-width="8"/>
  <circle cx="128" cy="128" r="95" fill="none" stroke="#24160B" stroke-width="7" stroke-dasharray="3 21.87" transform="rotate(-0.9 128 128)" opacity="0.85"/>

  <!-- mostrador -->
  <circle cx="128" cy="128" r="84" fill="url(#face)" stroke="#24160B" stroke-width="6"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#7FD0CF" stroke-width="1.5" opacity="0.5"/>

  <!-- rosa dos ventos -->
  <g transform="translate(128 128)">
    <!-- pontas diagonais -->
    <g transform="rotate(45) scale(0.62)">
      <polygon points="0,-76 14,-14 76,0 14,14 0,76 -14,14 -76,0 -14,-14" fill="#D9B66A" stroke="#24160B" stroke-width="5" stroke-linejoin="round"/>
      <polygon points="0,-76 14,-14 0,0" fill="#B8923F"/>
      <polygon points="76,0 14,14 0,0" fill="#B8923F"/>
      <polygon points="0,76 -14,14 0,0" fill="#B8923F"/>
      <polygon points="-76,0 -14,-14 0,0" fill="#B8923F"/>
    </g>
    <!-- pontas cardeais -->
    <polygon points="0,-76 14,-14 76,0 14,14 0,76 -14,14 -76,0 -14,-14" fill="#FFF4D2"/>
    <polygon points="76,0 14,14 0,0" fill="#D9B66A"/>
    <polygon points="0,76 -14,14 0,0" fill="#D9B66A"/>
    <polygon points="-76,0 -14,-14 0,0" fill="#D9B66A"/>
    <polygon points="0,-76 -14,-14 0,0" fill="#E5513D"/>
    <polygon points="0,-76 14,-14 0,0" fill="#A32616"/>
    <path d="M0 -76 V0 M76 0 H0 M0 76 V0 M-76 0 H0" stroke="#24160B" stroke-width="2.5"/>
    <polygon points="0,-76 14,-14 76,0 14,14 0,76 -14,14 -76,0 -14,-14" fill="none" stroke="#24160B" stroke-width="4" stroke-linejoin="round"/>
    <circle r="9" fill="url(#gold)" stroke="#24160B" stroke-width="4"/>
    <circle r="3" fill="#24160B"/>
  </g>
</svg>
