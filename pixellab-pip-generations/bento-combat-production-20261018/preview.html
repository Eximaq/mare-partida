<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bento Espadachim · Animações em revisão</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#10262a;color:#f5e7c5;font:16px Georgia,serif}main{max-width:1120px;margin:auto}small{letter-spacing:.1em;color:#d8b875}h1{font-size:29px}p{line-height:1.5;color:#c8d5ce}h2{margin:28px 0 12px;font-size:22px}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}article{border:1px solid #806d47;padding:12px;text-align:center;background:#173233}article h3{font-size:16px;margin:0 0 8px}img{width:192px;height:192px;max-width:100%;object-fit:contain;image-rendering:pixelated}article p{font:13px Arial,sans-serif;margin:8px 0 0}.pending{min-height:100px;display:grid;place-items:center;color:#b7c7bd}.rejected{border-color:#e09a73}.rejected p{color:#ffba99}a{color:#edd08c}footer{margin:24px 0;font:14px Arial,sans-serif}@media(max-width:700px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}img{width:160px;height:160px}h1{font-size:25px}}</style>
<main><small>MARÉ PARTIDA · ESPADACHIM PIRATA</small><h1>Bento Maré-Livre</h1><p id="summary">Correções de direção em avaliação. Os clipes repetem aqui apenas para inspeção.</p><div id="gallery"></div><footer><a href="../../index.html">Jogo</a> · <a href="../../docs/BENTO-CORRECOES-DIRECIONAIS.md">Relatório e ressalvas</a> · <a href="../bento-combat-pilot-20261018/preview.html">Teste frontal anterior</a></footer></main>
<script>
const actions={'combat-idle':'Guarda de combate',attack:'Ataque básico','corte-de-mare':'Corte de Maré',hurt:'Reação ao dano',death:'Queda'};
const directions={south:'Frente',north:'Costas',west:'Esquerda',east:'Direita'};let version='';
async function update(){try{const [r,v]=await Promise.all([fetch('animation-files.json',{cache:'no-store'}),fetch('visual-review.json',{cache:'no-store'})]);if(!r.ok)return;const data=await r.json(),review=v.ok?await v.json():{};const next=JSON.stringify([data,review]);if(next===version)return;version=next;
const pending=Object.keys(review.rejected||{});document.getElementById('summary').textContent=pending.length?'Clipes em correção: '+pending.map(key=>{const [a,d]=key.split('/');return actions[a]+' · '+directions[d]}).join(', ')+'. No jogo, essas combinações usam provisoriamente a guarda armada estática.':'Correções de direção aplicadas. Os clipes repetem aqui apenas para inspeção; no jogo, golpes e quedas executam uma vez.';
const gallery=document.getElementById('gallery');gallery.replaceChildren();
for(const [action,title] of Object.entries(actions)){const h=document.createElement('h2');h.textContent=title;gallery.append(h);const row=document.createElement('div');row.className='row';gallery.append(row);
for(const [direction,label] of Object.entries(directions)){const card=document.createElement('article'),head=document.createElement('h3'),p=document.createElement('p');head.textContent=label;card.append(head);const bad=review.rejected?.[action+'/'+direction];if(bad)card.classList.add('rejected');
if(data[action]?.[direction]){const im=document.createElement('img');im.src=action+'-'+direction+'-preview.gif';im.alt=title+' · '+label;card.append(im);p.textContent=bad?'Falha de direção · clipe preservado para avaliação':data[action][direction].length+' frames · em avaliação';}
else{p.className='pending';p.textContent='Aguardando geração';}card.append(p);row.append(card);}}}catch{}}
update();setInterval(update,5000);
</script></html>
