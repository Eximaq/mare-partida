<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><base href="../"><title>Orange Town — inspeção de terreno</title>
<style>body{margin:0;background:#17282b;color:#f0dfb4;font:14px sans-serif}header{padding:12px}canvas{display:block;image-rendering:pixelated}</style>
<script src="orange-world.js"></script><script src="terrain-autotile.js"></script><script src="orange-terrain.js"></script><script src="orange-renderer.js"></script></head>
<body><header>Inspeção com renderizador real. A comparação usa os scripts do commit-base, sem reconstruir uma versão fictícia do “antes”. Aprovação artística continua manual.</header><canvas id="scene" width="768" height="512"></canvas>
<script>
(async()=>{
 await MareOrangeRenderer.boot;
 const views={rua:{x:640,y:672},praca:{x:864,y:864},cais:{x:0,y:1440},chunks:{x:960,y:960},cantos:{x:1280,y:128}};
 const name=new URLSearchParams(location.search).get('view')||'praca',camera=views[name]||views.praca,c=document.getElementById('scene').getContext('2d');
 c.imageSmoothingEnabled=false;c.translate(-camera.x,-camera.y);MareOrangeRenderer.ground(c,camera,768,512,0,true);
 MareOrange.props.slice().sort((a,b)=>a.y-b.y).forEach(p=>MareOrangeRenderer.prop(c,p));
 window.captureState={name,camera,renderer:MareOrangeRenderer.stats()};document.body.dataset.ready='true';
})().catch(e=>{document.body.dataset.error=e.message;console.error(e)});
</script></body></html>
