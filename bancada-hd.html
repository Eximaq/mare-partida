</head><body><header><div><small>KAIZOKU IDLE</small><h1>Bancada de encaixe</h1></div><nav><label class="button">Importar JSON<input id="file" type="file" accept=".json,application/json"></label><button id="export">Exportar rascunho</button></nav></header>
<main><aside aria-label="Catálogo de equipamentos"><h2>Equipamentos</h2><label>Buscar no catálogo<input id="search" type="search" placeholder="Nome, ID ou categoria"></label><label>Categoria<select id="filter"></select></label><div id="catalog"></div></aside>
<section class="stage"><div class="stagebar"><label>Movimento<select id="action"></select></label><label>Direção<select id="direction"><option value="south">Sul</option><option value="east">Leste</option><option value="north">Norte</option><option value="west">Oeste</option></select></label></div>
<div id="viewport"><canvas id="figure" aria-label="Prévia do personagem em pixels nativos"></canvas></div>
<div class="transport"><button id="prev" aria-label="Fase anterior">◀</button><button id="play">Reproduzir</button><button id="next" aria-label="Próxima fase">▶</button><label><input type="checkbox" id="loop" checked> Repetir</label><select id="speed" aria-label="Velocidade"><option value=".25">¼×</option><option value=".5">½×</option><option selected>1</option><option>2</option></select><label>Zoom <input id="zoom" type="range" min=".35" max="3" step=".05" value=".85"></label></div>
<label class="timeline"><output id="clock">Fase</output><input type="range" id="tick" min="0" max="0" value="0"></label>
<div class="toggles"><label><input type="checkbox" id="before"> Original</label><label><input type="checkbox" id="solo"> Isolar no corpo</label><label><input type="checkbox" id="guides"> Guias</label></div>
<div id="status" role="status">Carregando os registros HD…</div></section>
<aside aria-label="Ajustes e aparência"><h2>Posicionamento</h2><label>Peça em edição<select id="slot"></select></label><label><input type="checkbox" id="pin-slot"> Manter peça em edição ao trocar o conjunto</label><button id="remove">Desequipar peça</button><label>Parte<select id="part"></select></label><label>Aplicar a<select id="scope"><option value="cycle">Ciclo inteiro</option><option value="phase">Fase atual</option></select></label>
<p id="position-item"></p><div class="history"><button id="outfit-position" aria-pressed="false">Criar exceção para este conjunto</button><button id="apply-positions">Aplicar posições a todos os conjuntos</button></div>
<div class="coords"><label>X <input type="number" id="x" step="1" value="0"></label><label>Y <input type="number" id="y" step="1" value="0"></label></div><div class="arrows"><button data-move="-1,0" aria-label="Um pixel à esquerda">←</button><button data-move="0,-1" aria-label="Um pixel acima">↑</button><button data-move="0,1" aria-label="Um pixel abaixo">↓</button><button data-move="1,0" aria-label="Um pixel à direita">→</button></div>
<div class="coords"><label>Rotação (°)<input id="angle" type="number" value="0" min="-180" max="180" step="1"></label><label>Tamanho (%)<input id="size" type="number" value="100" min="1" step="1"></label></div>
<label><input id="flip" type="checkbox"> Espelhar item</label><label>Camada<select id="layer"></select></label>
<div class="history" id="mirror-tools" hidden><button id="mirror-west" title="Copiar os ajustes de Leste para Oeste">Espelhar oeste</button><button id="mirror-east" title="Copiar os ajustes de Oeste para Leste">Espelhar leste</button></div>
<p id="details"></p><div class="history"><button id="undo">Desfazer</button><button id="redo">Refazer</button><button id="reset">Restaurar parte</button></div>
<details open><summary>Personagem de teste</summary><label>Classe<select id="role"></select></label><div id="appearance"></div><label><input type="checkbox" id="hide"> Ocultar capacete</label></details>
</aside></main></body></html>
