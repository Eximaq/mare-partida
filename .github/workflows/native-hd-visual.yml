      - 'tests/rework-male-c6-p133-side-walk.cjs'
      - 'tests/rework-male-w0-coat-b9-south-idle.cjs'
      - 'tests/rework-male-bare-glove-locomotion.cjs'
      - 'tests/rework-female-south-boots-saved-head.cjs'
