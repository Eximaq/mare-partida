name: Rework HD nativo — jogo real e capturas
on:
  pull_request:
    branches: [main]
    paths:
      - 'player-rework-*hd*'
      - 'tools/rework-*-hd/**'
      - 'paper-doll-96-lobby.js'
      - 'tests/native_hd_game_browser.cjs'
      - 'tests/rework_default_game_browser.cjs'
      - 'tests/rework-integration*.cjs'
      - 'tests/rework_inventory_game_browser.cjs'
      - 'tests/rework-v5-binding.test.cjs'
      - 'tests/rework_v5_game_browser.cjs'
      - 'tests/rework_v5_ui_browser.cjs'
      - 'tests/rework_movement_ui_browser.cjs'
      - 'tests/rework-direction-retention.test.cjs'
      - 'tools/audit_rework_integration.cjs'
      - 'tools/verify_native_hd_archives.py'
      - '.github/workflows/native-hd-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-hd-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/verify_native_hd_archives.py
      - run: npm run test:rework-hd
      - run: node --test player-rework-default-hd.test.cjs tests/rework-integration.test.cjs tests/rework-v5-binding.test.cjs tests/rework-direction-retention.test.cjs
      - run: node tools/audit_rework_integration.cjs
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.62.1
      - name: Chromium and actual Pages build
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          bash tools/install_ci_chromium.sh npx playwright
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/native-hd-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Capture normal world renderer without touching owner saves
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/native-hd-game
        run: node tests/native_hd_game_browser.cjs
      - name: Authentic starter saves use the replacement without editing equipment
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-default-game
        run: node tests/rework_default_game_browser.cjs
      - name: Real inventory canonical bindings
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-inventory
        run: node tests/rework_inventory_game_browser.cjs
      - name: Exact V5 through real inventory and SOUTH combat
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-v5
        run: node tests/rework_v5_game_browser.cjs
      - name: Real keyboard movement and static idle, both bodies
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-movement-ui
        run: node tests/rework_movement_ui_browser.cjs
      - name: Five V5 states initiated only by pointer combat
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-v5-ui
        run: node tests/rework_v5_ui_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-user-flow-evidence
          path: |
            artifacts/rework-movement-ui/
            artifacts/rework-v5-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-v5-evidence
          path: artifacts/rework-v5/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-inventory-evidence
          path: artifacts/rework-inventory/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-default-save-evidence
          path: artifacts/rework-default-game/
          if-no-files-found: ignore
      - name: Split evidence into downloadable native-resolution groups
        if: always()
        run: python tools/split_native_hd_evidence.py artifacts/native-hd-game artifacts/native-hd-parts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hd-runtime-report
          path: artifacts/native-hd-game/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-hd-real-game-part0
          path: artifacts/native-hd-parts/part0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
