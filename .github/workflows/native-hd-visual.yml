      - 'tests/rework_v5_ui_browser.cjs'
      - 'tests/rework_movement_ui_browser.cjs'
      - 'tests/rework-direction-retention.test.cjs'
      - 'tools/audit_rework_integration.cjs'
      - 'tools/verify_native_hd_archives.py'
      - '.github/workflows/native-hd-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-hd-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  wardrobe-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Movimentos do catálogo, oclusão da mão e peitorais nas adagas
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WARDROBE_EVIDENCE: ${{ runner.temp }}/adagas-384.json
        run: |
          node --test tests/rework-wardrobe-map-action.test.cjs
          node tests/rework-male-dagger-coat-cycles.cjs
      - name: Peitorais nas duas manoplas e no braço tecnológico
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          node tests/rework-registered-weapon-coats.cjs
          node --expose-gc tests/rework-male-p114-signed-slots-saved.cjs
          node tests/rework-wardrobe-grip-cycles.cjs
          node --expose-gc tests/rework-wardrobe-authored-contact.cjs
          node tests/rework-south-wardrobe-ownership.cjs
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          name: wardrobe-independence-dagger-frames
          path: ${{ runner.temp }}/adagas-384.json
          retention-days: 3
          if-no-files-found: warn
  articulated-helmets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Comparar o quadro da arma, o cabelo e os pixels dos dez capacetes
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          for role in sword rogue gunner healer strategist; do
            node --expose-gc tests/rework-articulated-weapon-heads.cjs "$role"
          done
      - name: Comparar as mangas, mãos e lâminas das seis espadas laterais
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: node --expose-gc tests/rework-articulated-sword-coats.cjs
  articulated-boots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        role: [sword, gunner, strategist, healer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Comparar os dez pares de botas em todos os quadros da família
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: node --expose-gc tests/rework-articulated-boots.cjs "${{ matrix.role }}"
      - name: Verificar o crânio e a oclusão nas duas orbes
        if: matrix.role == 'strategist'
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          node tests/rework-ordered-orb-anatomy.cjs
          node --expose-gc tests/rework-ordered-orb-coats.cjs
      - name: Comparar mangas, mãos e arma com a fonte de cada fase
        if: matrix.role == 'healer'
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          node --expose-gc tests/rework-ordered-staff-coats.cjs
          python -m pip install pillow numpy
          python tests/rework_staff_coat_sources.py
          python tools/export_north_pistol_coats.py --verify
          node --expose-gc tests/rework-north-pistol-coats.cjs
          python tools/register_north_rifle_trousers.py --verify
          python tools/export_north_focus_coats.py --verify
          node --expose-gc tests/rework-fixed-north-rifle-trousers.cjs
          node --expose-gc tests/rework-fixed-north-rifle-boots.cjs
          node --expose-gc tests/rework-fixed-north-rifle-heads.cjs
          node --expose-gc tests/rework-north-focus-coats.cjs
  weapon-materials:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Comparar os ciclos das sete classes com três combinações de cores
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: node tests/rework-male-weapon-material-cycles.cjs
  native-historical:
    name: native-historical (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: hd
            command: npm run test:rework-hd
          - suite: ordered-poses
            command: node --test --test-concurrency=1 player-rework-default-hd.test.cjs tests/rework-integration.test.cjs tests/rework-v5-binding.test.cjs tests/rework-approved-rifles.test.cjs tests/rework-approved-orb17-carry.test.cjs tests/rework-female-authored-adjustments.test.cjs tests/rework-approved-swords-south.test.cjs tests/rework-approved-coat151-idle.test.cjs tests/rework-approved-outfit-idle.test.cjs tests/rework-approved-torso130-walk.test.cjs tests/rework-approved-staff128.test.cjs tests/rework-approved-lateral-attacks.test.cjs tests/rework-direction-retention.test.cjs tests/rework-separable-*.test.cjs tests/rework-independent-female-pants.test.cjs tests/rework-independent-female-pants-fourth.test.cjs tests/rework-independent-female-pants-fifth.test.cjs tests/rework-authored-ordered-attacks.test.cjs tests/rework-ordered-world-bundle.test.cjs tests/rework-sixth-*.test.cjs tests/rework-six-daggers-ordered.test.cjs tests/rework-seventh-world-bundle.test.cjs tests/rework-eighth-*.test.cjs tests/rework-ninth-*.test.cjs tests/rework-tenth-*.test.cjs tests/rework-eleventh-*.test.cjs tests/rework-f182-*.test.cjs tests/rework-slot151-*.test.cjs tests/rework-sn4-*.test.cjs tests/rework-sn7-*.test.cjs tests/rework-female-south-neck-*.test.cjs tests/rework-female-south-carry*.test.cjs
          - suite: materials
            command: node --test --test-concurrency=1 tests/rework-female-north-layered.test.cjs tests/rework-female-profile-rig.test.cjs tests/rework-female-direction-*.test.cjs tests/rework-female-walk-directions-world.test.cjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/materialize_native_indexes.py
      - run: ${{ matrix.command }}
  native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/verify_native_hd_archives.py
      - name: HD de um save com espaços vazios no inventário
        run: node --test tests/rework-literal-null-equipment.cjs
      - name: Camadas HD independentes, sem substituir o personagem
        run: node --test --test-concurrency=2 tests/rework-male-c6-p22-named-head.cjs tests/rework-male-independent-pants-locomotion.cjs tests/rework-male-south-idle-gloves-independent.cjs tests/rework-male-imperial-b183-south-idle.cjs tests/rework-male-w0-c6-b9-south-idle.cjs tests/rework-male-w0-c6-g25-north.cjs
      - name: Segundo lote de camadas e porte de arma HD
        run: node --expose-gc --test --test-concurrency=2 tests/rework-male-c6-p22-other-punches.cjs tests/rework-male-c6-p168-south-locomotion.cjs tests/rework-male-c6-p133-side-walk.cjs tests/rework-male-w0-coat-b9-south-idle.cjs tests/rework-male-bare-glove-locomotion.cjs tests/rework-female-south-boots-saved-head.cjs tests/rework-manopla14-blue-carry.cjs
      - name: Porte HD com cabelo salvo e peças independentes
        run: node --expose-gc --test --test-concurrency=2 tests/rework-named-carry-head-saved.cjs tests/rework-male-named-focus-carry.cjs tests/rework-male-spiky-focus-carry.cjs tests/rework-male-sword-coat-b9-south-idle.cjs tests/rework-male-w67-c6-g25-north-idle.cjs tests/rework-relic32-p22-carry.cjs
      - run: node tools/audit_rework_integration.cjs
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.62.1
      - name: Chromium and actual Pages build
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          bash tools/install_ci_chromium.sh npx playwright
          python tools/build_pages.py --renderer-fixture
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/native-hd-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Carregamento visual com movimento e combate
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-visual-async
        run: |
          node tests/rework_visual_readiness_browser.cjs
          MARE_FAIL_VISUAL=1 node tests/rework_visual_readiness_browser.cjs
      - name: Capture normal world renderer without touching owner saves
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/native-hd-game
        run: node tests/native_hd_game_browser.cjs
      - name: Authentic starter saves use the replacement without editing equipment
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-default-game
        run: node tests/rework_default_game_browser.cjs
      - name: Real inventory canonical bindings
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-inventory
        run: node tests/rework_inventory_game_browser.cjs
      - name: Exact V5 through real inventory and SOUTH combat
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-v5
        run: node tests/rework_v5_game_browser.cjs
      - name: Real keyboard movement and static idle, both bodies
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-movement-ui
        run: node tests/rework_movement_ui_browser.cjs
      - name: Five V5 states initiated only by pointer combat
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-v5-ui
        run: node tests/rework_v5_ui_browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: rework-user-flow-evidence
          path: |
            artifacts/rework-movement-ui/
            artifacts/rework-v5-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: rework-v5-evidence
          path: artifacts/rework-v5/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: rework-inventory-evidence
          path: artifacts/rework-inventory/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: rework-default-save-evidence
          path: artifacts/rework-default-game/
          if-no-files-found: ignore
      - name: Split evidence into downloadable native-resolution groups
        if: always()
        run: python tools/split_native_hd_evidence.py artifacts/native-hd-game artifacts/native-hd-parts
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-runtime-report
          path: artifacts/native-hd-game/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part0
          path: artifacts/native-hd-parts/part0
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part1
          path: artifacts/native-hd-parts/part1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part2
          path: artifacts/native-hd-parts/part2
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part3
          path: artifacts/native-hd-parts/part3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part4
          path: artifacts/native-hd-parts/part4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part5
          path: artifacts/native-hd-parts/part5
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part6
          path: artifacts/native-hd-parts/part6
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part7
          path: artifacts/native-hd-parts/part7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part8
          path: artifacts/native-hd-parts/part8
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          retention-days: 3
          name: native-hd-real-game-part9
          path: artifacts/native-hd-parts/part9
