  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-hd-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  wardrobe-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Movimentos do catálogo, oclusão da mão e peitorais nas adagas
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WARDROBE_EVIDENCE: ${{ runner.temp }}/adagas-384.json
        run: |
          node --test tests/rework-wardrobe-map-action.test.cjs
          node tests/rework-male-dagger-coat-cycles.cjs
      - name: Peitorais nas duas manoplas e no braço tecnológico
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          node tests/rework-registered-weapon-coats.cjs
          node --expose-gc tests/rework-male-p114-signed-slots-saved.cjs
          node tests/rework-wardrobe-grip-cycles.cjs
          node --expose-gc tests/rework-wardrobe-authored-contact.cjs
          node tests/rework-south-wardrobe-ownership.cjs
      - uses: actions/upload-artifact@v4
        if: failure() || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'preserve-evidence')
        with:
          name: wardrobe-independence-dagger-frames
          path: ${{ runner.temp }}/adagas-384.json
          retention-days: 3
          if-no-files-found: warn
  lateral-punch-wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [2, 3, 110, 111, 112, 118, 119]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as 50 peças e os oito quadros em cada direção
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          node --expose-gc tests/rework-lateral-gauntlet-wardrobe.cjs east ebony "$WEAPON"
          node --expose-gc tests/rework-lateral-gauntlet-wardrobe.cjs west light "$WEAPON"
      - name: Conferir o punho Norte nas oito fases e nas duas aparências
        if: matrix.weapon == 110
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          node --expose-gc tests/rework-north-padded-gauntlet.cjs light
          node --expose-gc tests/rework-north-padded-gauntlet.cjs ebony
  dagger-gloves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [12, 13, 71, 72, 73, 74]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as duas mãos, as dez luvas e a oclusão das lâminas nas seis adagas
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-ordered-hand-gloves.cjs "$WEAPON" "$tone"
          done
  orb-gloves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [17, 122]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as duas mãos, as dez luvas e a oclusão dos orbes e o formato antigo de aparência
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-orb-hand-gloves.cjs "$WEAPON" "$tone"
          done
  sword-gloves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [0, 1, 67, 68, 69, 70]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as duas mãos, as dez luvas e a oclusão de cada espada
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-articulated-sword-gloves.cjs "$WEAPON" "$tone"
          done
  staff-gloves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [31, 123, 124, 125, 126, 127, 128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as duas mãos, as dez luvas e a oclusão de cada cajado
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-ordered-staff-gloves.cjs "$WEAPON" "$tone"
          done
      - name: Comparar a cintura e as dez calças com o conjunto durante o ataque de perfil
        if: ${{ !cancelled() && matrix.weapon != 128 }}
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: node --expose-gc tests/rework-side-focus-trousers.cjs "$WEAPON"
  south-focus-trousers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [16, 17, 31, 32, 121, 122]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir as dez calças nas oito fases da conjuração
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-south-focus-trousers.cjs "$WEAPON" "$tone"
            node --expose-gc tests/rework-south-focus-trousers.cjs "$WEAPON" "$tone" --boots
          done
  south-punch-wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        weapon: [2, 3, 14, 110, 111, 118, 119, 120]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Conferir os capacetes e as botas nas doze fases do golpe
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
          WEAPON: ${{ matrix.weapon }}
        run: |
          for tone in light ebony; do
            node --expose-gc tests/rework-south-punch-helmets.cjs "$WEAPON" "$tone"
            node --expose-gc tests/rework-south-punch-boots.cjs "$WEAPON" "$tone"
            node --expose-gc tests/rework-south-gauntlet-gloves.cjs "$WEAPON" "$tone"
            node --expose-gc tests/rework-south-gauntlet-coats.cjs "$WEAPON" "$tone"
            case "$WEAPON" in
              111|118|119|120) node --expose-gc tests/rework-south-forearm-trousers.cjs "$WEAPON" "$tone";;
              *) node --expose-gc tests/rework-south-signed-punch-trousers.cjs "$WEAPON" "$tone";;
            esac
          done
          node --expose-gc tests/rework-south-punch-pairs.cjs "$WEAPON"
  articulated-helmets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/build_pages.py
      - name: Comparar o quadro da arma, o cabelo e os pixels dos dez capacetes
        env:
          HD_PUBLISHED_ROOT: ${{ github.workspace }}/dist
        run: |
          for role in sword rogue gunner healer strategist; do
            node --expose-gc tests/rework-articulated-weapon-heads.cjs "$role"
          done
