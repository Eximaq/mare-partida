name: Conchas — jogo e capturas
on:
  pull_request:
    branches: [main]
    paths:
      - 'conchas-*.js'
      - 'pixellab-world-maps.js'
      - 'assets/world-maps/conchas/**'
      - 'assets/new-islands/helmeppo/**'
      - 'game.js'
      - 'world-system.js'
      - 'orange-terrain.js'
      - 'terrain-autotile.js'
      - 'assets/terrain/**'
      - 'tests/conchas_browser.py'
      - 'tools/build_pages.py'
      - '.github/workflows/conchas-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conchas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar Chromium e build
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          python tools/build_pages.py
      - name: Conferir jogo e capturar o pacote estático
        env:
          MARE_TEST_URL: http://127.0.0.1:8123/dist/
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/conchas-server.log 2>&1 &
          sleep 2
          python tests/conchas_browser.py
      - name: Capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conchas-capturas
          path: /tmp/mare-conchas-pixellab-review/
          if-no-files-found: warn
          retention-days: 14
