name: Akainu - recuperar fontes para revisao
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-recover-text.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/feature/akainu-weekly-boss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconciliar main sem sobrescrever o colaborador
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
      - name: Restaurar apenas os blocos completos conferidos pela auditoria
        run: |
          python3 - <<'PY'
          import base64,zlib,re,hashlib,subprocess
          from pathlib import Path
          v=[p.read_text().strip() for p in sorted(Path('tools').glob('akainu-source-part*.txt'))]
          correction=Path('tools/akainu-source-correction.txt').read_text().strip()
          v[1]=v[1][:v[1].rfind(correction[:4])]+correction
          s=''.join(v).rstrip('=');data=base64.b64decode(s+'='*((-len(s))%4),validate=True)
          d=zlib.decompressobj(31);raw=b''
          for b in data:
              try:raw+=d.decompress(bytes([b]))
              except zlib.error:break
          chunks=re.split(r'(?=^diff --git )',raw.decode('utf-8',errors='replace'),flags=re.M)
          hashes={3:'7bb91914552f65bdf3a3059b916f701dca94719373e4a77db67755ff69fd3c11',4:'317d4c1ade3ce7655bc95eec5857ed0b791ee1ada39083bf8b443239d8d79832',5:'44aedc68147ba12d9f787ea8ca3d1c7980788227ed899bb8b91f09300e104c42',6:'559f453227f69df07318af4f176ae190c9edbba2e3af3870ae613117d8756807',7:'94fcaf790531a3b6a913a526f3d1da051d3b6be6d8667466a0e7bb5dbed4cd82',8:'10bf6a8b7248adf9707b5c565cc8117380ec64833a2ad219a9a59cf00cf453f6',9:'3e4332e95c77d7e1022eb6ec27b9d2ca0216355dba2c884e216a96583249d52e',10:'8ccddd61c454a4ff463f1e3c63cd9be837b2b6bcfba8a4ddc07eb43cdca5409c',11:'208774286fcf265896a3f38d0190b1a0738b49e8ec08da0ce56df34f983b4c71',12:'e3295f0b848ec445ee2330de1eea817e9261832a78b2a2c956bbd09536e3e3d3',13:'26f97890c8c1dc7f4966425aaf2537948af180aac7b32ae7ca2c6c0585dbcd56',14:'71822cd363290b835ba6a4cf150da85b12d8ddf678ca3eb47e74ab2ed7c5852a',15:'e59d1d427d423bab3211d650c26045cb96156ea68750259f0a81ab51e8ebc60e',16:'d02a13edeb78e00671e56a8a817ed2041780c961720f845b09f56e4d7773e619'}
          selected=[]
          for i,h in hashes.items():
              assert hashlib.sha256(chunks[i].encode()).hexdigest()==h,(i,'changed block')
              assert '\ufffd' not in chunks[i]
              selected.append(chunks[i])
          patch=''.join(selected);paths=re.findall(r'^\+\+\+ b/(.+)$',patch,re.M)
          assert len(paths)==14 and all('..' not in Path(p).parts for p in paths)
          Path('/tmp/recovery.patch').write_text(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/recovery.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/recovery.patch'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          print('Recovered source paths for review:',paths)
          PY
          node --check akainu-art-data.js
          node --check akainu-art.js
          node --check akainu-combat.js
          git diff --cached --check
      - name: Salvar recuperacao incompleta sem merge nem deploy
        run: |
          git commit -m 'wip: recover Akainu source for completion and review; not release ready'
          git push origin HEAD:feature/akainu-weekly-boss
