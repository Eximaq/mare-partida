name: Publicar demonstracao no GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-demo:
    name: Demonstração local do Pages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Preparar a demonstração local
        run: python3 tools/build_pages.py --static-demo
      - name: Verificar os arquivos publicados
        run: python3 tests/production_pages_test.py
      - name: Preparar Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/pages-browser" playwright@1.56.1 --no-save --package-lock=false
          bash tools/install_ci_chromium.sh "$RUNNER_TEMP/pages-browser/node_modules/.bin/playwright"
      - name: Jogar e recarregar o save pelo servidor estático
        env:
          NODE_PATH: ${{ runner.temp }}/pages-browser/node_modules
        run: python3 tests/run_honors_hd_browser.py tests/pages-local-browser.cjs --offline --dist
      - name: Enviar o pacote validado
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: static-demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
