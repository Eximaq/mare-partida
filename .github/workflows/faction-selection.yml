name: Seleção de facções
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-preview.html'
      - 'game.js'
      - 'ui-screens.css'
      - 'ui-responsive.css'
      - 'assets/ui/faction-emblems/**'
      - 'tests/faction_selection_browser.cjs'
      - '.github/workflows/faction-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factionSelection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8159 --bind 127.0.0.1 > "$RUNNER_TEMP/factions-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8159/dist/ > /dev/null
      - name: Validar emblemas, seleção e criação
        run: node tests/faction_selection_browser.cjs http://127.0.0.1:8159/dist/ --evidence="$RUNNER_TEMP/faction-selection"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faction-selection
          path: ${{ runner.temp }}/faction-selection
          if-no-files-found: ignore
