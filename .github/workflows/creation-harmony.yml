name: Criação e harmonia das HUDs
on:
  pull_request:
    branches: [main]
    paths:
      - 'creation-selection.*'
      - 'gameplay-harmony.css'
      - 'hud-nautical.css'
      - 'tests/hud_nautical_browser.py'
      - 'tests/hud_compact_browser.py'
      - 'assets/ui/hud-nautical-v2/**'
      - 'game.js'
      - 'index.html'
      - 'assets/ui/creation-hd/**'
      - 'tools/build_pages.py'
      - 'tests/*creation*'
      - 'tests/*harmony*'
      - 'tests/original-inventory-online-browser.cjs'
      - 'market-online-ui.*'
      - 'tests/market-online-browser.cjs'
      - 'tests/social-online-browser.cjs'
      - 'social-ui.*'
      - 'party-ui.js'
      - 'party.css'
      - 'tests/party-online-browser.cjs'
      - 'hud-glass.css'
      - 'weekly-boss-ui.*'
      - 'tests/weekly-glass-browser.cjs'
      - 'tests/merchant-glass-browser.cjs'
      - 'tests/online-world-browser.cjs'
      - 'tests/online-battle-browser.cjs'
      - 'apps/account-client/game-*.js'
      - '.github/workflows/creation-harmony.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  creationHarmony:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MARE_QA_DIR: /tmp/mare-creation-harmony
      MARE_HARMONY_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Preparar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          bash tools/install_ci_chromium.sh npx playwright
          python -m pip install playwright==1.56.0
          mkdir -p "$MARE_QA_DIR"
      - name: Regras e pacote estático
        run: |
          node --test tests/creation-selection.test.cjs tests/character-system.test.cjs tests/character-appearance.test.cjs tests/talent-system.test.cjs tests/character-quick-menu.test.cjs tests/notification-system.test.cjs
          python tools/build_pages.py
      - name: Criação e controles no preview publicado
        run: |
          python tests/run_honors_hd_browser.py tests/creation_selection_hd_browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/gameplay_harmony_controls_browser.cjs --dist --offline
      - name: Composição náutica e controles em telas atuais
        env:
          MARE_TEST_URL: http://127.0.0.1:8172/dist/
          HUD_COMPACT_EVIDENCE: /tmp/mare-creation-harmony/compact
          HUD_EVIDENCE: /tmp/mare-creation-harmony/nautical
        run: |
          python -m http.server 8172 --bind 127.0.0.1 > /tmp/nautical-hud.log 2>&1 &
          sleep 2
          python tests/hud_nautical_browser.py
          python tests/hud_compact_browser.py
      - name: Original inventory and forge online UI contract (no hosted provider)
        run: python tests/run_honors_hd_browser.py tests/original-inventory-online-browser.cjs --dist --offline
      - name: Social e Mercado dos Mares no navegador
        run: |
          MARE_QA_DIR="$MARE_QA_DIR/social" python tests/run_honors_hd_browser.py tests/social-online-browser.cjs --dist --offline
          MARE_QA_DIR="$MARE_QA_DIR/market" python tests/run_honors_hd_browser.py tests/market-online-browser.cjs --dist --offline
      - name: Boss semanal e Mercador do Porto
        run: |
          python tests/run_honors_hd_browser.py tests/weekly-glass-browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/merchant-glass-browser.cjs --dist --offline
      - name: Grupo compacto e comandos online
        run: MARE_QA_DIR="$MARE_QA_DIR/party" python tests/run_honors_hd_browser.py tests/party-online-browser.cjs --dist --offline
      - name: Original online world and travel UI contract
        run: python tests/run_honors_hd_browser.py tests/online-world-browser.cjs --dist --offline
      - name: Original online monsters and combat UI contract
        run: python tests/run_honors_hd_browser.py tests/online-battle-browser.cjs --dist --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criacao-harmonia-hd
          path: /tmp/mare-creation-harmony/
          if-no-files-found: warn
          retention-days: 14
