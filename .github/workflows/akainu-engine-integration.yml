name: Akainu - integrar motor na branch
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-engine-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/akainu-weekly-boss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Aplicar pontos de integracao explicitos e verificar sintaxe
        run: |
          python3 - <<'PY'
          import ast,re,hashlib,subprocess
          from pathlib import Path
          p=Path('world-battle.cjs');s=p.read_text()
          def replace(old,new):
              global s
              assert s.count(old)==1,old[:100]
              s=s.replace(old,new)
          replace("'world-battle.cjs','party-battle.cjs'","'world-battle.cjs','akainu-combat.js','weekly-boss-rules.cjs','weekly-boss-battle.cjs','party-battle.cjs'")
          replace("  if(b.dungeon){kills.push({id:m.id", "  if(b.weeklyBossInstanceId&&m.source==='weekly-boss'){m.action=null;m.telegraph=null;kills.push({id:m.id,area:b.area,monster:structuredClone(m),reward:null,weeklyBossId:b.weeklyBossInstanceId});event(b,'kill',{id:m.id});return;}\n  if(b.dungeon){kills.push({id:m.id")
          replace("const physical=m.type!=='spirit';","const physical=m.type!=='spirit'&&warning?.damageType!=='magma';")
          replace("  for(const enemy of b.mobs.filter(m=>m.alive)){","  for(const enemy of b.mobs.filter(m=>m.alive)){\n   if(b.weeklyBossInstanceId&&enemy.source==='weekly-boss')continue;")
          needle=" stats=combatStats(b,{...c,now},rt);b.hp=Math.min(b.hp,stats.maxHP);b.energy=Math.min(b.energy,stats.maxEnergy);\n talents.save"
          replacement=""" // Internal worker-only impacts. Strict HTTP schemas never accept this context.
           if(b.weeklyBossInstanceId&&c.shared&&Array.isArray(c.weeklyDamage))for(const impact of c.weeklyDamage){
            const source=b.mobs.find(m=>m.id===impact.sourceId&&m.source==='weekly-boss'),action=source?.action;
            if(!live(source)||b.hp<=0||!action?.impacted||action.id!==impact.attackId||action.kind!==impact.kind||impact.targetId!==c.shared.actorId||b.weeklyLastImpact===impact.attackId||now<action.impactAt||now>action.endAt)continue;
            const aoe=action.kind==='aoe',origin=aoe?action.center:source;
            if(!origin||distance(hero,origin)>(aoe?action.radius:source.reach+10)||!clear(origin,hero))continue;
            b.weeklyLastImpact=impact.attackId;
            damage(source,aoe?source.profile.aoeMultiplier:1,{damageType:'magma',groundTrap:aoe});
           }
           stats=combatStats(b,{...c,now},rt);b.hp=Math.min(b.hp,stats.maxHP);b.energy=Math.min(b.energy,stats.maxEnergy);
           talents.save"""
          replace(needle,replacement);p.write_text(s)
          def source_hash(ref=None):
              read=lambda f: subprocess.check_output(['git','show',ref+':'+f]).decode().replace('\r\n','\n') if ref else Path(f).read_text().replace('\r\n','\n')
              files=ast.literal_eval(re.search(r'const sources=(\[[^\n]+\]);',read('world-battle.cjs')).group(1))
              return hashlib.sha256('\0'.join(f+read(f) for f in files).encode()).hexdigest()
          predecessors=sorted({source_hash('8458c468ee929a57b8a4c0f6bf3a9b6327408c8b'),source_hash('69dac39e1a85ef9d294a9bccfe76ed85eee7fb7d')});target=source_hash()
          p=Path('apps/game-server/migrations/0050_akainu_weekly_boss.sql');s=p.read_text();s=s[:s.index('-- Known predecessor only.')]
          s+='-- Only the two audited repository predecessors; unknown hashes remain blocked.\n'
          s+='-- No health, inventory, XP or historical receipt is rewritten.\n'
          quoted=','.join("'"+h+"'" for h in predecessors)
          s+=f"UPDATE mare_game.character_battles SET simulation=jsonb_set(simulation,'{{rulesHash}}',to_jsonb('{target}'::text)) WHERE simulation->>'rulesHash' IN ({quoted});\n"
          p.write_text(s);print('Audited predecessors:',predecessors,'Target:',target)
          PY
          node --check world-battle.cjs
          node --check weekly-boss-battle.cjs
          node --check weekly-boss-rules.cjs
          git diff --check
      - name: Executar a regressao que falhou antes da integracao
        run: node --test tests/akainu-combat.test.cjs tests/weekly-boss-battle.test.cjs tests/weekly-boss-rules.test.cjs
      - name: Registrar somente a integracao validada na branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-battle.cjs apps/game-server/migrations/0050_akainu_weekly_boss.sql
          git commit -m 'feat: integrate canonical weekly boss impacts without hunt loot or duplicate damage'
          git push origin HEAD:feature/akainu-weekly-boss
