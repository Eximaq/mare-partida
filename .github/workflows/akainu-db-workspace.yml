name: Akainu - ferramentas descartaveis de teste
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-db-workspace.yml]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/akainu-db
          docker run --rm --entrypoint bash -v /tmp/akainu-db:/out postgres:18.6-bookworm -ec '
            mkdir -p /tmp/pgroot/lib
            cp -a /usr/lib/postgresql /tmp/pgroot/
            cp -a /usr/share/postgresql /tmp/pgroot/share
            find /usr/lib/postgresql/18/bin /usr/lib/postgresql/18/lib -type f -exec ldd {} \; 2>/dev/null | awk "/=> \\// {print \$3}" | sort -u | while read p; do case "$p" in */libc.so.*|*/libm.so.*|*/libpthread.so.*|*/libdl.so.*|*/librt.so.*|*/ld-linux*) ;; *) cp -L "$p" /tmp/pgroot/lib/ ;; esac; done
            tar -czf /out/pg-tools.tar.gz -C /tmp/pgroot .
          '
          git archive --format=tar.gz HEAD tests/integration/server-weekly-boss.test.mts .github/workflows/akainu-weekly.yml > /tmp/akainu-db/remote-tests.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: akainu-db-tools
          path: /tmp/akainu-db
          retention-days: 1
