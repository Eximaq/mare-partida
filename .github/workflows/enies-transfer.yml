name: Transferir mapa aprovado de Enies Lobby

on:
  push:
    branches: [feature/enies-lobby-integration]
    paths: [.github/workflows/enies-transfer.yml]

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/enies-lobby-integration
          sparse-checkout: |
            .github/workflows/enies-transfer.yml
            assets/exported-maps/enies-lobby/
          sparse-checkout-cone-mode: false
      - name: Reconstituir o arquivo original e verificar sua integridade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          parts = ['c5ac3cecfb49e71b64708a020aa3c34a7e02e653', '90e76b9c0139bc695a005759d1a1ebccd1e0488b']
          output = bytearray()
          for sha in parts:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/Eximaq/mare-partida/git/blobs/{sha}',
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request, timeout=60) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha
              output.extend(data)
          assert len(output) == 19324690
          assert hashlib.sha256(output).hexdigest() == '7f2f094c13043bed5fda091cf18168f27a50470233b1f084364dedf0abc017c9'
          path = pathlib.Path('assets/exported-maps/enies-lobby/map.webp')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(output)
          print('Mapa aprovado: 19324690 bytes; SHA-256 conferido.')
          PY
      - name: Salvar o mapa na branch de integração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/exported-maps/enies-lobby/map.webp
          test "$(git hash-object assets/exported-maps/enies-lobby/map.webp)" = e34c0b3ad395acc1c1b257e6508941bcc5a0406a
          git commit -m 'Adiciona mapa aprovado de Enies Lobby com integridade verificada'
          git push origin HEAD:feature/enies-lobby-integration
