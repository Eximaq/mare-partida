name: Akainu - workspace isolado
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Empacotar somente fontes versionados para revisao
        run: |
          mkdir -p /tmp/akainu-workspace
          git archive --format=tar.gz HEAD > /tmp/akainu-workspace/branch.tar.gz
          git archive --format=tar.gz origin/main > /tmp/akainu-workspace/main.tar.gz
          git rev-parse HEAD > /tmp/akainu-workspace/branch-ref.txt
          git rev-parse origin/main > /tmp/akainu-workspace/main-ref.txt
          git diff 8458c468ee929a57b8a4c0f6bf3a9b6327408c8b origin/main --stat > /tmp/akainu-workspace/main-changes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: akainu-source-review
          path: /tmp/akainu-workspace
          retention-days: 1
