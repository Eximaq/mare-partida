name: Authoritative server foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: mare_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mare_test_admin -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mare_test_admin:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: node tools/server-completeness.mts
      - run: npm run test:foundation
      - name: PostgreSQL archive tools
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-18
      - run: npm run test:integration
        env:
          PG_BIN: /usr/lib/postgresql/18/bin
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate prepared HTTPS proxy configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mare-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/mare-tls/privkey.pem" -out "$RUNNER_TEMP/mare-tls/fullchain.pem" -days 1 -subj /CN=game.example.invalid 2>/dev/null
          docker run --rm -v "$PWD/infra/hosting/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro" -v "$RUNNER_TEMP/mare-tls:/etc/mare/tls:ro" nginx:stable nginx -t
      - name: Generate disposable credentials for this runner
        shell: bash
        run: |
          for name in MARE_ADMIN_PASSWORD MARE_OWNER_PASSWORD MARE_RUNTIME_PASSWORD; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Validate and build Compose profiles
        run: |
          docker compose -f infra/compose.yaml --profile server --profile tools config --quiet
          docker compose -f infra/compose.yaml --profile server --profile tools build
      - name: Initialize isolated database and run migrations
        run: |
          docker compose -f infra/compose.yaml up -d --wait postgres
          docker compose -f infra/compose.yaml --profile tools run --rm migrate
          docker compose -f infra/compose.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U mare_owner -d mare_dev -f /opt/mare/grant-health.sql
          docker compose -f infra/compose.yaml --profile tools run --rm migrate
      - name: Check container health, isolation and runtime privileges
        run: |
          docker compose -f infra/compose.yaml --profile server up -d --wait --wait-timeout 90 server
          curl --fail --silent http://127.0.0.1:8788/health/live
          curl --fail --silent http://127.0.0.1:8788/health/ready
          docker compose -f infra/compose.yaml exec -T server node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          import pg from 'pg';
          import { getGameCatalog } from './apps/game-server/dist/gameplay/catalog.js';
          import {xpNeeded} from './apps/game-server/dist/gameplay/character.js';
          assert.equal(xpNeeded(21),16001);
          const {createRequire}=await import('node:module');
          const world=createRequire(import.meta.url)('./world-catalog.cjs').load();
          assert.equal(world.maps.lobby.spawn.x,1504);
          const battle=createRequire(import.meta.url)('./world-battle.cjs');
          const contracts=createRequire(import.meta.url)('./contract-system.js');
          assert.equal(contracts.quests.length,10);
          const talents=createRequire(import.meta.url)('./talent-runtime.cjs');
          assert.equal(talents.T.nodes('sword').length,15);
          assert.equal(battle.create('beach',{maxHP:200,maxEnergy:90},0,()=>.5).mobs.length,14);
          assert(world.navigation('dawn').walkable(872,1608));
          assert.equal(getGameCatalog().items.length, 187);
          assert.equal(getGameCatalog().slots.length, 12);
          assert.equal(getGameCatalog().rulesHash, 'b1981b18a1634fee07a0c0ae53ce1a13b32d9e4b91fbc05dde6e421c34c09325');
          assert.notEqual(process.getuid(), 0);
          for (const path of ['/app/.env', '/app/.git', '/app/game.js', '/app/node_modules/typescript']) {
            assert.equal(existsSync(path), false, path);
          }
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            assert.equal((await pool.query('SELECT current_user')).rows[0].current_user, 'mare_runtime');
            assert.equal((await pool.query('SELECT count(*)::int AS n FROM mare_meta.schema_migrations')).rows[0].n, 52);
            await assert.rejects(pool.query('SELECT * FROM mare_game.accounts'), { code: '42501' });
            await assert.rejects(pool.query('CREATE SCHEMA forbidden'), { code: '42501' });
          } finally { await pool.end(); }
          for (const path of ['/.env', '/.git/HEAD', '/api/akuma/register', '/ws']) {
            assert.equal((await fetch(`http://127.0.0.1:8787${path}`)).status, 404);
          }
          assert.equal((await fetch('http://127.0.0.1:8787/health/live', { method: 'POST' })).status, 405);
          console.log('Docker smoke passed: health, migration repeatability, non-root runtime, no game or credential files, restricted SQL role.');
          JS
      - name: Enable BFF locally without contacting a provider
        shell: bash
        run: |
          value=$(openssl rand -base64 32)
          echo "::add-mask::$value"
          echo "AUTH_ENCRYPTION_KEY=$value" >> "$GITHUB_ENV"
          docker compose -f infra/compose.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U mare_owner -d mare_dev -f /opt/mare/grant-auth.sql
      - name: Verify auth-enabled container and minimum SQL grants
        env:
          SUPABASE_URL: https://phase2-ci.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_unused_fixture
          SESSION_ABSOLUTE_SECONDS: "3600"
          SESSION_IDLE_SECONDS: "600"
          PROVIDER_RECHECK_SECONDS: "60"
        run: |
          docker compose -f infra/compose.yaml -f infra/compose.auth.yaml --profile server config --quiet
          docker compose -f infra/compose.yaml -f infra/compose.auth.yaml --profile server up -d --wait --wait-timeout 90 server
          docker compose -f infra/compose.yaml -f infra/compose.auth.yaml exec -T server node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const csrf = await fetch('http://127.0.0.1:8787/v1/auth/csrf');
          assert.equal(csrf.status,200);
          assert.match(csrf.headers.get('set-cookie'),/Secure; HttpOnly; SameSite=Lax/);
          assert.equal((await fetch('http://127.0.0.1:8787/v1/me')).status,401);
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await pool.query('SELECT id FROM mare_game.accounts LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_progression LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.game_inventory LIMIT 1');
            assert.equal((await pool.query("SELECT has_column_privilege(current_user,'mare_game.game_inventory','mana_potions','UPDATE') AS ok")).rows[0].ok, true);
            await pool.query('SELECT character_id FROM mare_game.character_world LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.character_world'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.character_battles LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.world_battle_rewards LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.contract_progress LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.contract_claims LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_talents LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.talent_legacy_allowances LIMIT 1');
            await assert.rejects(pool.query('UPDATE mare_game.talent_legacy_allowances SET budget=budget'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.achievement_progress LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.achievement_claims LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_prison LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.prison_floors LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_dungeons LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.dungeon_claims'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.prison_milestones'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.achievement_claims'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.battle_talent_steals LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.character_talent_events'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.contract_progress'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.contract_progress SET character_id=character_id'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.contract_claims SET gold_delta=gold_delta'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.contract_claims'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.character_battles'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.character_battles SET character_id=character_id'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.world_battle_rewards SET gold_delta=gold_delta'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.world_battle_rewards'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.game_inventory_events LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.game_inventory'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.game_inventory SET alpha_snapshot=alpha_snapshot'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.game_inventory_events'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.game_inventory_events SET gold_delta=gold_delta'),{code:'42501'});
            await pool.query('SELECT level FROM mare_game.progression_levels LIMIT 1');
            await pool.query('SELECT cost FROM mare_game.character_attribute_ledger LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.character_attribute_ledger'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.character_attribute_ledger SET strength=strength'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.character_level_ledger'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.progression_levels SET required_experience=0'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.character_commands LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_journey_ledger LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.character_journey_ledger'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.combat_encounters LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.combat_rounds LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.combat_rewards LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.combat_rounds'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.combat_rewards'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.combat_encounters SET catalog_id=catalog_id'),{code:'42501'});
            await pool.query('SELECT character_id FROM mare_game.character_hunts LIMIT 1');
            await pool.query('SELECT character_id FROM mare_game.character_hunt_rewards LIMIT 1');
            await assert.rejects(pool.query('DELETE FROM mare_game.character_hunt_rewards'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.character_hunts SET begun_at=now()'),{code:'42501'});
            await assert.rejects(pool.query('DELETE FROM mare_game.character_commands'),{code:'42501'});
            assert.equal((await pool.query('UPDATE mare_game.character_progression SET level=level WHERE false')).rowCount,0);
            await assert.rejects(pool.query('UPDATE mare_game.character_progression SET character_id=character_id'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.character_level_ledger SET experience_total=experience_total'),{code:'42501'});
            assert.equal((await pool.query('UPDATE mare_game.characters SET name=name WHERE false')).rowCount,0);
            await assert.rejects(pool.query('UPDATE mare_game.characters SET account_id=account_id'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.characters SET id=id'),{code:'42501'});
            await assert.rejects(pool.query('UPDATE mare_game.accounts SET subject=subject'),{code:'42501'});
            await assert.rejects(pool.query('CREATE SCHEMA forbidden'),{code:'42501'});
          } finally { await pool.end(); }
          console.log('Auth-enabled Docker smoke passed; no hosted Supabase calls were made.');
          JS

  shared-lobby-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: mare_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mare_test_admin -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mare_test_admin:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python tools/build_pages.py
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Prepare isolated browser and trusted local certificate
        run: |
          npm install --prefix "$RUNNER_TEMP/mare-browser" playwright@1.56.1
          bash tools/install_ci_chromium.sh "$RUNNER_TEMP/mare-browser/node_modules/.bin/playwright"
          command -v certutil >/dev/null || sudo apt-get install -y libnss3-tools
          mkdir -p infra/local
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 -subj /CN=Mare-CI-Disposable-CA -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$RUNNER_TEMP/mare-ca.key" -out "$RUNNER_TEMP/mare-ca.crt" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=localhost -keyout infra/local/localhost.key -out "$RUNNER_TEMP/mare-local.csr" 2>/dev/null
          cat > "$RUNNER_TEMP/mare-local.ext" <<'CERT'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          CERT
          openssl x509 -req -in "$RUNNER_TEMP/mare-local.csr" -CA "$RUNNER_TEMP/mare-ca.crt" -CAkey "$RUNNER_TEMP/mare-ca.key" -CAcreateserial -days 1 -sha256 -extfile "$RUNNER_TEMP/mare-local.ext" -out infra/local/localhost.crt 2>/dev/null
          openssl verify -CAfile "$RUNNER_TEMP/mare-ca.crt" infra/local/localhost.crt
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          certutil -A -d "sql:$HOME/.pki/nssdb" -n mare-local-test -t 'C,,' -i "$RUNNER_TEMP/mare-ca.crt"
      - name: Two isolated accounts in original port, real HTTPS API and PostgreSQL
        run: NODE_PATH="$RUNNER_TEMP/mare-browser/node_modules" node --import tsx tests/shared-lobby-browser.mts
      - name: Distant mouse routes and chase stay within server speed
        run: NODE_PATH="$RUNNER_TEMP/mare-browser/node_modules" node --import tsx tests/online-walking-browser.mts
      - name: Human fruit casting, independent skill slots and stationary ranged attack
        run: |
          python -m http.server 8181 --bind 127.0.0.1 >"$RUNNER_TEMP/combat-preview.log" 2>&1 &
          preview=$!
          trap 'kill "$preview"' EXIT
          NODE_PATH="$RUNNER_TEMP/mare-browser/node_modules" node tests/combat-targeted-browser.cjs
          NODE_PATH="$RUNNER_TEMP/mare-browser/node_modules" MARE_TEST_URL=http://127.0.0.1:8181/ MARE_QA_DIR=tmp/social-online node tests/social-online-browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shared-lobby-browser-failure
          path: |
            tmp/shared-lobby-browser/
            tmp/online-walking/
            tmp/social-online/
          retention-days: 3
          if-no-files-found: ignore
