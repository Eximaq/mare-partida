      - 'tests/paper_doll_complete_browser.py'
      - 'tests/paper_doll_melee_browser.py'
      - 'tests/paper_doll_player_browser.py'
      - 'tests/paper-doll-player.test.cjs'
      - 'tests/paper_doll_emitter_qa.py'
      - 'tests/paper_doll_diagnostics_browser.py'
      - 'pixellab-pip-generations/paper-doll-complete-20261026/**'
      - 'pixellab-pip-generations/paper-doll-final-categories-20261026/**'
      - 'pixellab-pip-generations/paper-doll-rogue-20261025/**'
      - 'pixellab-pip-generations/paper-doll-gunner-20261025/**'
      - 'pixellab-pip-generations/paper-doll-unarmed-combat-20261024/**'
      - 'tests/paper_doll_punch_browser.py'
      - 'pixellab-pip-generations/paper-doll-category-attacks-20261023/**'
      - 'paper-doll-look.css'
      - 'tests/paper_doll_browser.py'
      - 'tests/paper_doll_partial_browser.py'
      - 'tests/paper_doll_idle_browser.py'
      - 'tests/paper_doll_sword_browser.py'
      - 'tests/paper_doll_layer_batch_browser.py'
      - 'tests/paper_doll_rigid_browser.py'
      - 'tests/paper_doll_modular_idle_browser.py'
