      - 'tests/paper_doll_compact_test.py'
      - 'tests/paper_doll_north_study_browser.py'
      - 'tests/paper_doll_north_complete_browser.py'
      - 'tests/paper_doll_gif_test.py'
      - 'pixellab-pip-generations/paper-doll-north-finish-20261021/**'
      - 'docs/PAPER-DOLL-NORTE-COMPLETO.md'
      - 'docs/PAPER-DOLL-CAMINHADAS-LATERAIS.md'
      - 'pixellab-pip-generations/paper-doll-walk-profiles-20261021/**'
      - 'tests/paper_doll_profiles_browser.py'
      - 'pixellab-pip-generations/paper-doll-basic-sword-20261021/**'
      - 'docs/PAPER-DOLL-ATAQUE-BASICO.md'
      - 'tests/paper-doll-rotation.test.cjs'
      - 'tests/paper_doll_rotation_browser.py'
      - 'tests/paper_doll_basic_sword_browser.py'
      - 'tests/paper_doll_bento_motion_browser.py'
      - 'tests/paper-doll-motion-study.test.cjs'
      - 'pixellab-pip-generations/paper-doll-bento-motion-20261021/**'
      - 'pixellab-pip-generations/paper-doll-bento-skeleton-20261021/**'
      - 'docs/PAPER-DOLL-MOVIMENTO-BENTO.md'
      - 'tests/paper-doll-directions.test.cjs'
      - 'tests/paper_doll_directions_browser.py'
      - 'pixellab-pip-generations/paper-doll-bento-directions-20261021/**'
      - 'docs/PAPER-DOLL-DIRECOES-BENTO.md'
      - 'tools/paper_doll_motion_controls.py'
      - 'tests/paper_doll_motion_controls_test.py'
      - 'tests/paper-doll-occlusion.test.cjs'
      - 'tests/paper-doll-motion-repair.test.cjs'
      - 'tests/paper_doll_repair_browser.py'
      - 'pixellab-pip-generations/paper-doll-bento-repair-20261022/**'
      - 'docs/PAPER-DOLL-CORRECAO-GUIAS.md'
      - 'pixellab-pip-generations/paper-doll-exact-retouch-20261022/**'
      - 'docs/PAPER-DOLL-RETOQUE-EXATO.md'
      - 'tests/paper-doll-exact-retouch.test.cjs'
      - 'tests/paper_doll_exact_retouch_browser.py'
      - 'pixellab-pip-generations/paper-doll-east-fit-20261022/**'
      - 'docs/PAPER-DOLL-ENCAIXE-LESTE.md'
      - 'tests/paper-doll-east-fit.test.cjs'
      - 'tests/paper_doll_east_fit_browser.py'
      - 'tests/paper_doll_east_fit_combat_browser.py'
      - 'tests/paper_doll_sheet_fit_browser.py'
      - 'tests/paper_doll_continuity_browser.py'
      - 'tests/paper_doll_body_continuity_browser.py'
      - 'pixellab-pip-generations/paper-doll-body-continuity-20261022/**'
      - 'docs/PAPER-DOLL-CORPO-CONTINUIDADE.md'
      - 'docs/PAPER-DOLL-CABELO-CONTINUIDADE.md'
      - 'pixellab-pip-generations/paper-doll-hair-continuity-20261022/**'
      - 'tests/paper_doll_hair_continuity_browser.py'
      - 'pixellab-pip-generations/paper-doll-walk-north-20261021/**'
      - 'docs/PAPER-DOLL-CAMINHADA-NORTE.md'
      - 'pixellab-pip-generations/paper-doll-walk-fit-20261021/**'
      - 'docs/PAPER-DOLL-CAMINHADA.md'
      - 'pixellab-pip-generations/paper-doll-expansion-20261021/**'
      - 'tests/paper_doll_rigid_assembly_test.py'
      - 'tests/paper-doll-attachment.test.cjs'
      - 'tests/paper_doll_fit_audit_test.py'
      - 'tests/paper_doll_masked_candidate_test.py'
      - 'tests/paper_doll_batch_audit_test.py'
      - 'tools/paper_doll_fit_audit.py'
      - 'tools/paper_doll_batch_audit.py'
      - 'pixellab-pip-generations/paper-doll-human-idle-south-20261021/**'
      - 'pixellab-pip-generations/paper-doll-sword-fit-20261021/**'
      - 'pixellab-pip-generations/paper-doll-layer-batch-20261021/**'
      - 'pixellab-pip-generations/paper-doll-rigid-weapon-20261021/**'
      - 'pixellab-pip-generations/paper-doll-hair-outfit-20261021/**'
      - 'tests/universal_character_browser.py'
      - 'tests/class_combat_v2_browser.py'
      - '.github/workflows/paper-doll-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-doll:
    runs-on: ubuntu-latest
    # Cold preparation used 9m44s of the former 10m total job budget.
    # Includes the dressed candidate's full locomotion/combat browser regression.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e pacote
        run: |
          python -m pip install playwright==1.63.0 Pillow==13.0.0
          python -m playwright install --with-deps chromium
          python tests/paper_doll_fit_audit_test.py
          python tests/paper_doll_masked_candidate_test.py
          python tests/paper_doll_batch_audit_test.py
          python tests/paper_doll_body_edit_test.py
          python tests/paper_doll_compact_test.py
          python tests/paper_doll_rigid_assembly_test.py
          python tests/paper_doll_gif_test.py
          python tests/paper_doll_motion_controls_test.py
          python pixellab-pip-generations/paper-doll-sword-fit-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-layer-batch-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-rigid-weapon-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-hair-outfit-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-expansion-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-walk-fit-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-walk-north-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-north-finish-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-walk-profiles-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-basic-sword-20261021/assemble_review.py
          python pixellab-pip-generations/paper-doll-bento-motion-20261021/assemble.py
          python pixellab-pip-generations/paper-doll-bento-motion-20261021/extract_visible_pieces.py
          python pixellab-pip-generations/paper-doll-bento-skeleton-20261021/assemble.py
          python pixellab-pip-generations/paper-doll-bento-skeleton-20261021/extract_visible_pieces.py
          python pixellab-pip-generations/paper-doll-bento-directions-20261021/compose.py
          python pixellab-pip-generations/paper-doll-bento-repair-20261022/assemble_review.py
          python pixellab-pip-generations/paper-doll-exact-retouch-20261022/assemble_review.py
          python pixellab-pip-generations/paper-doll-east-fit-20261022/assemble_review.py
          python pixellab-pip-generations/paper-doll-body-continuity-20261022/assemble_review.py
          python pixellab-pip-generations/paper-doll-hair-continuity-20261022/assemble_review.py
          python pixellab-pip-generations/paper-doll-navy-starter-20261023/assemble_review.py
          python tests/paper_doll_inputs_test.py
          python tools/build_pages.py
      - name: Conferir bancada, fallback e jogo
        env:
          MARE_TEST_URL: http://127.0.0.1:8123/dist/
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/paper-doll-server.log 2>&1 &
          sleep 2
          python tests/paper_doll_browser.py
          python tests/paper_doll_partial_browser.py
          python tests/paper_doll_idle_browser.py
          python tests/paper_doll_sword_browser.py
          python tests/paper_doll_layer_batch_browser.py
          python tests/paper_doll_rigid_browser.py
          python tests/paper_doll_modular_idle_browser.py
          python tests/paper_doll_socket_browser.py
          python tests/paper_doll_expansion_browser.py
          python tests/paper_doll_world_review_browser.py
          python tests/paper_doll_walk_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-walk-fit-20261021/ python tests/paper_doll_world_review_browser.py
          MARE_WALK_REVIEW_PACK=pixellab-pip-generations/paper-doll-walk-north-20261021/ python tests/paper_doll_walk_browser.py
          python tests/paper_doll_north_study_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-walk-north-20261021/ python tests/paper_doll_world_review_browser.py
          MARE_WALK_REVIEW_PACK=pixellab-pip-generations/paper-doll-north-finish-20261021/ python tests/paper_doll_walk_browser.py
          python tests/paper_doll_north_complete_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-north-finish-20261021/ python tests/paper_doll_world_review_browser.py
          MARE_WALK_REVIEW_PACK=pixellab-pip-generations/paper-doll-walk-profiles-20261021/ python tests/paper_doll_walk_browser.py
          python tests/paper_doll_profiles_browser.py
          python tests/paper_doll_rotation_browser.py
          python tests/paper_doll_basic_sword_browser.py
          python tests/paper_doll_bento_motion_browser.py
          MARE_MOTION_STUDY=pixellab-pip-generations/paper-doll-bento-skeleton-20261021/ python tests/paper_doll_bento_motion_browser.py
          python tests/paper_doll_directions_browser.py
          python tests/paper_doll_repair_browser.py
          python tests/paper_doll_exact_retouch_browser.py
          python tests/paper_doll_east_fit_browser.py
          python tests/paper_doll_east_fit_combat_browser.py
          python tests/paper_doll_sheet_fit_browser.py
          python tests/paper_doll_continuity_browser.py
          python tests/paper_doll_body_continuity_browser.py
          python tests/paper_doll_hair_continuity_browser.py
          python tests/paper_doll_navy_starter_browser.py
          python tests/paper_doll_dev_browser.py
          python tests/paper_doll_look_browser.py
          python tests/paper_doll_punch_browser.py
          python tests/paper_doll_unarmed_browser.py
          python tests/paper_doll_gunner_browser.py
          python tests/paper_doll_rogue_browser.py
          python tests/paper_doll_complete_browser.py
          python tests/paper_doll_melee_browser.py
          python tests/paper_doll_player_browser.py
          python tests/paper_doll_diagnostics_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-navy-starter-20261023/ python tests/paper_doll_world_review_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-hair-continuity-20261022/ python tests/paper_doll_world_review_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-basic-sword-20261021/ python tests/paper_doll_world_review_browser.py
          MARE_REVIEW_PACK=pixellab-pip-generations/paper-doll-walk-profiles-20261021/ python tests/paper_doll_world_review_browser.py
          python tests/universal_character_browser.py
          python tests/class_combat_v2_browser.py
      - name: Capturas e medições para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-doll-infraestrutura-capturas
          path: docs/evidence-paper-doll/
          if-no-files-found: warn
          retention-days: 14
