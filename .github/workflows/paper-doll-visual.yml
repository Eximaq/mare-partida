name: Paper Doll — infraestrutura e fallback
on:
  pull_request:
    branches: [main]
    paths:
      - 'paper-doll*.js'
      - 'faction-sprites.js'
      - 'game.js'
      - 'index.html'
      - 'assets/paper-doll/**'
      - 'tools/paper-doll-inspector/**'
