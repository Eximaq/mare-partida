name: Akainu - recuperar contratos e testes
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-recover-contracts.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/feature/akainu-weekly-boss'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar somente blocos completos com caminhos validados
        run: |
          python3 - <<'PY'
          import base64,zlib,re,hashlib,subprocess,json
          from pathlib import Path
          v=[p.read_text().strip() for p in sorted(Path('tools').glob('akainu-source-part*.txt'))]
          correction=Path('tools/akainu-source-correction.txt').read_text().strip()
          v[1]=v[1][:v[1].rfind(correction[:4])]+correction
          v[1]=v[1][:9887]+v[1][9889:]
          raw=zlib.decompressobj(31).decompress(base64.b64decode(''.join(v),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='9bbfc9fbcac9bd8d3f13c833a8d83209cf9c0c264a517be39406efcbaa1ed6bd'
          chunks=re.split(r'(?=^diff --git )',raw.decode('utf8'),flags=re.M)
          assert len(chunks)==49
          pending=[];paths=[]
          for i in [1,2,*range(17,48)]:
              block=chunks[i];name=re.search(r'^\+\+\+ b/(.+)$',block,re.M).group(1)
              assert not name.startswith('/') and '..' not in Path(name).parts and not name.endswith(('.env','.png','.webp'))
              if i==18 or 30<=i<=46:
                  pending.append(block);continue
              p=Path('/tmp/recover.patch');p.write_text(block)
              check=subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],capture_output=True,text=True)
              if check.returncode:
                  print('MANUAL REVIEW:',name,check.stderr);pending.append(block);continue
              subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True);paths.append(name)
          for p in paths:
              if p.endswith('.json'):json.loads(Path(p).read_text())
              if p.endswith(('.js','.cjs')):subprocess.run(['node','--check',p],check=True)
          pending_path='tools/akainu-recovery-review.patch';Path(pending_path).write_text(''.join(pending));paths.append(pending_path)
          # Retain the truncated final block for reading only; it is never applied.
          tail='tools/akainu-browser-recovery.txt';Path(tail).write_text(chunks[-1]);paths.append(tail)
          subprocess.run(['git','add','--',*paths],check=True)
          print('Recovered paths:',paths)
          PY
          git diff --cached --check
      - name: Registrar somente na branch de trabalho
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'wip: restore weekly boss protocol, client hooks and regression tests for review'
          git push origin HEAD:feature/akainu-weekly-boss
