name: Central do Navegante HD
on:
  pull_request:
    branches: [main]
    paths:
      - 'player-hub.*'
      - 'captain-hd.css'
      - 'hud-glass.css'
      - 'tests/settings-glass-browser.cjs'
      - 'game.js'
      - 'game-tooltips.js'
      - 'index.html'
      - 'journal-feed.json'
      - 'assets/ui/captain-hd/**'
      - 'tools/build_pages.py'
      - 'tests/*captain*'
      - 'tests/profile-online-browser.cjs'
      - 'apps/account-client/**'
      - 'tests/player-hub.test.cjs'
      - 'tests/run_honors_hd_browser.py'
      - '.github/workflows/captain-hd.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  captain:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MARE_QA_DIR: /tmp/mare-captain-hd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Preparar Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          bash tools/install_ci_chromium.sh npx playwright
      - name: Dados, privacidade, preferências e pacote estático
        run: |
          node --test tests/captain-hd.test.cjs tests/player-hub.test.cjs tests/game-tooltips.test.cjs tests/character-appearance.test.cjs tests/headgear-visibility.test.cjs tests/ui-system.test.cjs tests/character-hud-hierarchy.test.cjs
          python tools/build_pages.py
      - name: Navegador, controles e responsividade em dist
        run: python tests/run_honors_hd_browser.py tests/captain_hd_browser.cjs --dist --offline
      - name: Configurações de vidro e categorias SVG
        run: MARE_QA_DIR=/tmp/mare-captain-hd/settings-glass python tests/run_honors_hd_browser.py tests/settings-glass-browser.cjs --dist --offline
      - name: Original online profile and creation
        run: python tests/run_honors_hd_browser.py tests/profile-online-browser.cjs --dist --offline
      - name: Capturas reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-navegante-hd
          path: /tmp/mare-captain-hd/
          if-no-files-found: warn
          retention-days: 14
