name: Akainu - normalizar arte recuperada
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-art-normalize.yml]
permissions:
  contents: write
  actions: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: akainu-native-recovery-evidence
          run-id: 42394219633
          github-token: ${{ github.token }}
          path: /tmp/native
      - run: pip install Pillow numpy scipy
      - name: Conferir componentes inteiros antes de exportar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np
          from scipy.ndimage import label,find_objects
          import json,hashlib
          mpath=Path('assets/weekly-boss/akainu/manifest.json');m=json.loads(mpath.read_text());im=Image.open('/tmp/native/walk.png').convert('RGBA');a=np.array(im);labels,n=label(a[:,:,3]>0,np.ones((3,3)));objects=find_objects(labels);counts=np.bincount(labels.ravel());main=[i for i in range(1,n+1) if counts[i]>=400]
          print('::notice::Walking body components '+str([(i,int(counts[i]),[(s.start,s.stop) for s in objects[i-1]]) for i in main]))
          assert len(main)==16,('walking components require visual review',len(main))
          owners={}
          for i in main:
              yy,xx=np.where(labels==i);cell=(min(3,int(np.mean(yy)//96)),min(3,int(np.mean(xx)//96)));assert cell not in owners;owners[cell]=i
          assert len(owners)==16
          centers={i:np.array([np.mean(np.where(labels==i)[0]),np.mean(np.where(labels==i)[1])]) for i in main}
          assign={i:i for i in main}
          for i in range(1,n+1):
              if i in assign:continue
              yy,xx=np.where(labels==i);center=np.array([np.mean(yy),np.mean(xx)]);assign[i]=min(main,key=lambda j:np.linalg.norm(center-centers[j]))
          walk=Image.new('RGBA',(512,512));report=[];directions=['south','west','east','north']
          for row,direction in enumerate(directions):
              base=objects[owners[(row,0)]-1];anchorx=(base[1].start+base[1].stop)/2;foot=base[0].stop-row*96
              dx=round(64-anchorx);dy=116-foot
              for col in range(4):
                  ids=[i for i,j in assign.items() if j==owners[(row,col)]];mask=np.isin(labels,ids);yy,xx=np.where(mask);x0,x1,y0,y1=int(xx.min()),int(xx.max())+1,int(yy.min()),int(yy.max())+1
                  pixels=a[y0:y1,x0:x1].copy();pixels[~mask[y0:y1,x0:x1],3]=0
                  x=x0-col*96+dx;y=y0-row*96+dy
                  assert 0<x and 0<y and x+pixels.shape[1]<128 and y+pixels.shape[0]<128,('walking frame overflow',row,col,[x,y,pixels.shape])
                  frame=Image.new('RGBA',(128,128));frame.paste(Image.fromarray(pixels),(x,y));walk.paste(frame,(col*128,row*128));report.append({'clip':'walk','direction':direction,'frame':col,'sourceBounds':[x0,y0,x1,y1],'translation':[dx,dy]})
              m['clips']['walk'][direction]['size']=128;m['clips']['walk'][direction]['anchor']=[64,116]
          assert int(np.sum(np.array(walk)[:,:,3]))==int(np.sum(a[:,:,3])),'walking alpha lost or duplicated'
          # The first authored punch frame is a complete neutral stance. Reuse it
          # instead of shipping the two previously clipped idle reference cells.
          punch=Image.open('/tmp/native/punch.png').convert('RGBA');idle=Image.new('RGBA',(96,384))
          for row,direction in enumerate(directions):
              frame=punch.crop((0,row*128,128,(row+1)*128));box=frame.getchannel('A').getbbox();assert box and box[3]-box[1]<=92 and box[2]-box[0]<=92
              dx=round(48-(box[0]+box[2])/2);dy=90-box[3];target=Image.new('RGBA',(96,96));target.paste(frame,(dx,dy));assert sum(target.getchannel('A').tobytes())==sum(frame.getchannel('A').tobytes());idle.paste(target,(0,row*96));m['clips']['idle'][direction]['anchor']=[48,90]
              report.append({'clip':'idle','direction':direction,'source':'punch frame 0','translation':[dx,dy]})
          outputs={'idle':idle,'walk':walk,**{name:Image.open('/tmp/native/'+name+'.png').convert('RGBA') for name in ['hurt','punch','aoe','magma-area']}}
          sheets=[]
          for name,image in outputs.items():
              dest=Path('assets/weekly-boss/akainu/'+name+'.webp');image.save(dest,'WEBP',lossless=True,exact=True,method=6);assert Image.open(dest).convert('RGBA').tobytes()==image.tobytes();sheets.append({'name':name,'size':list(image.size),'rgbaSha256':hashlib.sha256(image.tobytes()).hexdigest()})
          m['normalizationNotes']=['Native RGB/alpha recovery; no resampling.','Walk components crossing old row boundaries restored without losing or duplicating alpha; fixed translation per direction.','Idle reuses the complete authored neutral punch pose; no generated substitute.']
          mpath.write_text(json.dumps(m,indent=2)+'\n')
          data=Path('akainu-art-data.js');s=data.read_text();start=s.index('{');end=s.rfind('}')
          print('DATA WRAPPER',s[:120],s[-180:])
          Path('assets/weekly-boss/akainu/recovery-provenance.json').write_text(json.dumps({'normalization':report,'sheets':sheets},indent=2)+'\n')
          # Replace the exact previous manifest payload, not arbitrary code braces.
          old=json.loads(__import__('subprocess').check_output(['git','show','HEAD:assets/weekly-boss/akainu/manifest.json']))
          oldcompact=json.dumps(old,ensure_ascii=False,separators=(',',':'));newcompact=json.dumps(m,ensure_ascii=False,separators=(',',':'))
          assert oldcompact in s,'art data wrapper differs; manual review required';data.write_text(s.replace(oldcompact,newcompact))
          PY
          node --check akainu-art-data.js
          node --test tests/akainu-assets.test.cjs tests/akainu-art.test.cjs
          git diff --check
      - name: Registrar a arte validada sem ativar evento
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/weekly-boss/akainu akainu-art-data.js
          git commit -m 'feat: restore full Akainu animation frames with stable pivots and lossless alpha'
          git push origin HEAD:feature/akainu-weekly-boss
