name: Chefes das masmorras
on:
  pull_request:
    branches: [main]
    paths:
      - 'boss-dungeon-*'
      - 'boss-dungeons.css'
      - 'hud-glass.css'
      - 'dungeon-boss-art-data.js'
      - 'sprite-combat-v2.js'
      - 'hunt-system.js'
      - 'game.js'
      - 'index.html'
      - 'ui-preview.html'
      - 'assets/sprites-combat-v2/dungeon-*/**'
      - 'assets/ui/boss-dungeons/**'
      - 'tests/*dungeon*'
      - 'tools/build_pages.py'
      - '.github/workflows/dungeon-bosses.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dungeonBosses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MARE_QA_DIR: /tmp/mare-dungeon-bosses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Preparar navegador
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          bash tools/install_ci_chromium.sh npx playwright
      - name: Perfis, animações, recompensas e pacote
        run: |
          node --test tests/boss-dungeons.test.cjs tests/boss-dungeon-combat.test.cjs tests/sprite-combat-v2.test.cjs tests/current-player-sprites.test.cjs tests/ui-mobile-preview.test.cjs
          python tools/build_pages.py
      - name: Combate dos nove chefes e recuperação de recursos
        run: python tests/run_honors_hd_browser.py tests/nine_dungeon_bosses_browser.cjs --dist --offline
      - name: Masmorras online na interface original
        run: python tests/run_honors_hd_browser.py tests/dungeons-online-browser.cjs --offline
      - name: Regressão de baú e fragmentos
        run: python tests/run_honors_hd_browser.py tests/boss_dungeons_browser.cjs --dist --offline
      - name: Janela de vidro responsiva
        run: python tests/run_honors_hd_browser.py tests/dungeons-glass-browser.cjs --dist --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nove-chefes-masmorras
          path: /tmp/mare-dungeon-bosses/
          if-no-files-found: warn
          retention-days: 7
