name: Akainu - concluir empacotamento
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-finalize-client.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Incluir somente arquivos publicos e a nova migracao nas fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess
          paths=[]
          for block in re.split(r'(?=^diff --git )',Path('tools/akainu-recovery-review.patch').read_text(),flags=re.M):
              match=re.search(r'^\+\+\+ b/(.+)$',block,re.M)
              if not match or not match[1].startswith('tests/integration/'):continue
              changes=[line[1:] for line in block.splitlines() if line.startswith('+') and not line.startswith('+++')]
              assert changes and all('0050_akainu_weekly_boss.sql' in line for line in changes),match[1]
              p=Path('/tmp/migration-tests.patch');p.write_text(block)
              subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True);paths.append(match[1])
          p=Path('tools/build_pages.py');s=p.read_text();needle='if not include_reviews:\n';assert s.count(needle)==1
          s=s.replace(needle,"web_files += ['weekly-boss-ui.js','weekly-boss-ui.css','akainu-art-data.js','akainu-art.js']\n"+needle);p.write_text(s);paths.append(str(p))
          p=Path('ui-preview.html');s=p.read_text();needle='<script defer src="party-ui.js"></script>';assert s.count(needle)==1
          s=s.replace(needle,'<link rel="stylesheet" href="weekly-boss-ui.css">\n  <script defer src="akainu-art-data.js"></script>\n  <script defer src="akainu-art.js"></script>\n  <script defer src="weekly-boss-ui.js"></script>\n  '+needle);p.write_text(s);paths.append(str(p))
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          node --check weekly-boss-ui.js
          node --test tests/akainu-ui.test.cjs tests/akainu-combat.test.cjs tests/weekly-boss-battle.test.cjs tests/weekly-boss-rules.test.cjs
          python tools/build_pages.py
          python tests/portal_build_test.py
          git diff --cached --check
      - name: Registrar integracao verificada na branch de trabalho
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: package weekly event UI and register additive migration expectations'
          git push origin HEAD:feature/akainu-weekly-boss
