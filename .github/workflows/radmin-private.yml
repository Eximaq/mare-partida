name: Radmin private configuration
on:
  pull_request:
    paths: ['tools/radmin/**', 'tests/radmin-*.ps1', '.github/workflows/radmin-private.yml']
  push:
    branches: [main]
    paths: ['tools/radmin/**', 'tests/radmin-*.ps1', '.github/workflows/radmin-private.yml']
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-configuration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration and PowerShell syntax
        shell: powershell
        run: ./tests/radmin-package.test.ps1
