name: Personagem atual — propriedade exclusiva e regressão
on:
  pull_request:
    branches: [main]
    paths:
      - 'character-appearance.js'
      - 'ui-screens.css'
      - 'tests/character-appearance.test.cjs'
      - 'tests/character_appearance_browser.cjs'
      - 'tests/character_appearance_materials_browser.cjs'
      - 'paper-doll-96-lobby.js'
      - 'combat-registry.js'
      - 'sprite-combat-v2.js'
      - 'sprite-combat-v2-data.js'
      - 'zoan-art.js'
      - 'assets/sprites-combat-v2/**'
      - 'rank-c-expansion.js'
      - '*-system.js'
      - 'tools/player96_release.py'
      - 'tests/player96_release_test.py'
      - 'tests/current-player-*.test.cjs'
      - 'tests/player_sprite_ownership_browser.cjs'
      - 'game.js'
      - 'headgear-visibility.js'
      - 'inventory-compact.css'
      - 'ui-preview.html'
      - 'tests/headgear-visibility.test.cjs'
      - 'tests/headgear_visibility_browser.cjs'
      - 'index.html'
      - 'tools/paper-doll-96-v3/**'
      - 'tools/build_pages.py'
      - 'tests/paper-doll-96-lobby.test.cjs'
      - 'tests/paper_doll_96_lobby_browser.cjs'
      - 'tests/paper-doll-96-weapons.test.cjs'
      - 'tests/paper-doll-96-other-weapons.test.cjs'
      - 'tests/class-weapons-*.cjs'
      - 'tests/class-weapon-layer-browser.cjs'
      - 'tests/equipment-*.cjs'
      - 'tests/firearm-south-carry.test.cjs'
      - 'tests/paper_doll_96_weapons_browser.cjs'
      - 'tests/ranged_autohunt_browser.cjs'
      - 'tools/paper_doll_96_weapon_materials.cjs'
      - '.github/workflows/paper-doll-96-lobby.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lobby96:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.62.1
      - name: Preparar Chromium e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/lobby96-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Verificar contrato e lobby real
        run: |
          python tools/player96_release.py --check
          python tests/player96_release_test.py
          node --test tests/current-player-release.test.cjs tests/current-player-sprites.test.cjs
          node tests/player_sprite_ownership_browser.cjs http://127.0.0.1:8157/dist/ --evidence="$RUNNER_TEMP/lobby96/ownership"
          node tests/paper-doll-96-lobby.test.cjs
          node tests/paper_doll_96_lobby_browser.cjs http://127.0.0.1:8157/dist/ --evidence="$RUNNER_TEMP/lobby96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-doll-96-lobby
          path: ${{ runner.temp }}/lobby96
          if-no-files-found: ignore

  weapons96:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/weapons96-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Auditar armas e combate real
        run: |
          node tests/paper-doll-96-weapons.test.cjs
          node tests/paper_doll_96_weapons_browser.cjs http://127.0.0.1:8157/dist/ --default-player --evidence="$RUNNER_TEMP/weapons96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-doll-96-weapons
          path: ${{ runner.temp }}/weapons96
          if-no-files-found: ignore

  otherWeapons96:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/other-weapons96-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Auditar armas e combate real
        run: |
          node tests/paper-doll-96-other-weapons.test.cjs
          node --test tests/class-weapons-batch-1.test.cjs tests/class-weapons-batch-2.test.cjs tests/class-weapons-remaining.test.cjs tests/firearm-south-carry.test.cjs tests/equipment-composition-policy.test.cjs
          node tests/class-weapons-fit-browser.cjs http://127.0.0.1:8157/
          node tests/class-weapon-layer-browser.cjs http://127.0.0.1:8157/
          node tests/equipment-occlusion-browser.cjs http://127.0.0.1:8157/
          node tests/ranged_autohunt_browser.cjs http://127.0.0.1:8157/dist/ --evidence="$RUNNER_TEMP/other-weapons96/ranged"
          node tests/paper_doll_96_weapons_browser.cjs http://127.0.0.1:8157/dist/ --other-classes --default-player --evidence="$RUNNER_TEMP/other-weapons96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-doll-96-other-weapons
          path: ${{ runner.temp }}/other-weapons96
          if-no-files-found: ignore

  headgear96:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/headgear96-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: Validar cabeça, inventário e personagem padrão
        run: |
          node tests/headgear-visibility.test.cjs
          node tests/headgear_visibility_browser.cjs http://127.0.0.1:8157/dist/ --evidence="$RUNNER_TEMP/headgear96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-doll-headgear96
          path: ${{ runner.temp }}/headgear96
          if-no-files-found: ignore

  appearance96:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar navegador e Pages
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          python tools/build_pages.py
          python -m http.server 8159 --bind 127.0.0.1 > "$RUNNER_TEMP/appearance-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8159/dist/ > /dev/null
      - name: Validar criação, persistência e camadas
        run: |
          node tests/character-appearance.test.cjs
          node tests/character_appearance_browser.cjs http://127.0.0.1:8159/dist/ --evidence="$RUNNER_TEMP/appearance96"
          node tests/character_appearance_materials_browser.cjs http://127.0.0.1:8159/dist/ --evidence="$RUNNER_TEMP/appearance96"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-appearance96
          path: ${{ runner.temp }}/appearance96
          if-no-files-found: ignore
