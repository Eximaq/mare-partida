name: Conquistas e Hierarquia HD
on:
  pull_request:
    branches: [main]
    paths:
      - 'achievement*.js'
      - 'apps/account-client/**'
      - 'tests/achievements-online-browser.cjs'
      - 'hierarchy*.js'
      - 'character-hud.js'
      - 'honors-hd.css'
      - 'hud-glass.css'
      - 'tests/progression-glass-browser.cjs'
      - 'talent-ui.js'
      - 'game.js'
      - 'index.html'
      - 'ui-preview.html'
      - 'ui-hud.css'
      - 'server/hierarchy.py'
      - 'server/app.py'
      - 'assets/ui/honors-hd/**'
      - 'tools/build_pages.py'
      - 'tests/*honors*'
      - 'tests/*hierarchy*'
      - '.github/workflows/honors-hd.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  honors:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MARE_QA_DIR: /tmp/mare-honors-hd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Preparar Chromium
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.56.1
          bash tools/install_ci_chromium.sh npx playwright
          mkdir -p "$MARE_QA_DIR"
      - name: Regras, componentes e pacote estático
        run: |
          node --test tests/honors-hd.test.cjs tests/hierarchy.test.cjs tests/character-hud-hierarchy.test.cjs tests/achievements-ultimates.test.cjs tests/talent-system.test.cjs tests/notification-system.test.cjs tests/character-quick-menu.test.cjs tests/current-player-sprites.test.cjs tests/current-player-release.test.cjs
          python tests/test_hierarchy.py
          python tools/build_pages.py
      - name: Navegador e serviço temporário
        run: |
          python tests/run_honors_hd_browser.py tests/achievements-online-browser.cjs --offline
          python tests/run_honors_hd_browser.py tests/hierarchy-online-browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/fruit-online-browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/honors_hd_browser.cjs --dist
          python tests/run_honors_hd_browser.py tests/honors_offline_browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/progression-glass-browser.cjs --dist --offline
          python tests/run_honors_hd_browser.py tests/honors_cache_browser.cjs --dist --offline
      - name: Capturas reais de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conquistas-hierarquia-hd
          path: /tmp/mare-honors-hd/
          if-no-files-found: warn
          retention-days: 14
