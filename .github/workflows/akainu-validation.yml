name: Akainu - validacao completa
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: ['**.js','**.cjs','**.ts','**.mts','**.mjs','**.sql','**.css','**.html','assets/weekly-boss/**','.github/workflows/akainu-validation.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: akainu-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: mare_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mare_test_admin -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mare_test_admin:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run typecheck
      - name: Materialize native rework indexes
        run: python3 tools/materialize_native_indexes.py
      - name: Full unit and legacy suite
        run: npm test
      - name: Install archive tools for real database backup tests
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client-18
      - name: Full PostgreSQL integration suite
        run: npm run test:integration
        env:
          PG_BIN: /usr/lib/postgresql/18/bin
      - run: node tools/server-completeness.mts
      - run: python tools/build_pages.py && python tests/portal_build_test.py
      - run: git diff --check
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: mare_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mare_test_admin -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mare_test_admin:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      - run: python tools/build_pages.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.56.1
      - name: Prepare isolated Chromium and trusted loopback certificate
        run: |
          npm install --prefix "$RUNNER_TEMP/mare-browser" playwright@1.56.1
          "$RUNNER_TEMP/mare-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y libnss3-tools
          mkdir -p infra/local
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 -subj /CN=Mare-CI-Disposable-CA -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$RUNNER_TEMP/mare-ca.key" -out "$RUNNER_TEMP/mare-ca.crt" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=localhost -keyout infra/local/localhost.key -out "$RUNNER_TEMP/mare-local.csr" 2>/dev/null
          cat > "$RUNNER_TEMP/mare-local.ext" <<'CERT'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          CERT
          openssl x509 -req -in "$RUNNER_TEMP/mare-local.csr" -CA "$RUNNER_TEMP/mare-ca.crt" -CAkey "$RUNNER_TEMP/mare-ca.key" -CAcreateserial -days 1 -sha256 -extfile "$RUNNER_TEMP/mare-local.ext" -out infra/local/localhost.crt 2>/dev/null
          openssl verify -CAfile "$RUNNER_TEMP/mare-ca.crt" infra/local/localhost.crt
          mkdir -p "$HOME/.pki/nssdb"
          certutil -N -d "sql:$HOME/.pki/nssdb" --empty-password
          certutil -A -d "sql:$HOME/.pki/nssdb" -n mare-local-test -t 'C,,' -i "$RUNNER_TEMP/mare-ca.crt"
      - name: Three sessions, shared Akainu, private isolation, AoE and reconnect
        run: NODE_PATH="$RUNNER_TEMP/mare-browser/node_modules" node --import tsx tests/weekly-boss-browser.mts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akainu-real-client-evidence
          path: tmp/weekly-boss-browser/
          retention-days: 7
          if-no-files-found: ignore
