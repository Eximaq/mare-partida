name: Testes essenciais
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Instalar dependências dos testes
        run: npm ci --ignore-scripts
      - name: Validar sintaxe
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Validar utilitario de contexto Codex
        run: |
          python3 -m py_compile tools/codex_snapshot.py
          python3 tools/codex_snapshot.py --area game --compare HEAD > /dev/null
      - name: Materializar índices do rework
        run: python3 tools/materialize_native_indexes.py
      - name: Regressao de jogo
        run: |
          for file in tests/*.test.cjs; do
            # Browser E2E requires Playwright + running server; it is not a standalone Node test.
            if [ "$file" = "tests/supa-browser.test.cjs" ]; then
              echo "SKIP $file (browser E2E; requires Playwright + test server)"
              continue
            fi
            node "$file"
          done
      - name: Verificar site estatico
        run: |
          python3 tests/paper_doll_pages_test.py
          python3 tools/build_pages.py
          python3 tests/production_pages_test.py
          python3 tests/portal_build_test.py
          python3 tools/build_portal.py
