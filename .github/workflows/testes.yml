name: Testes essenciais
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Regressao de jogo
        run: |
          for file in tests/*.test.cjs; do node "$file"; done
      - name: Verificar site estatico
        run: python3 tools/build_pages.py
