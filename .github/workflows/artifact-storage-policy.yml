name: Artifact storage policy
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/check_artifact_retention.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/check_artifact_retention.py'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python tools/check_artifact_retention.py
