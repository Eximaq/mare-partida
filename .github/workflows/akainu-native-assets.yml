name: Akainu - restaurar arte nativa
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-native-assets.yml]
permissions:
  contents: write
jobs:
  restore:
    if: github.ref == 'refs/heads/feature/akainu-weekly-boss'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - name: Preservar e inspecionar pixels sem promover arte incompleta
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib,io
          from pathlib import Path
          from PIL import Image,ImageChops,ImageDraw
          urls=json.loads(Path('tools/akainu-native-recovery.json').read_text());urls[0]=urls[0].replace('56cccf5b','56ccf5b')
          rgb=bytearray();alpha=bytearray();out=Path('/tmp/akainu-native');out.mkdir()
          for i,url in enumerate(urls):
              raw=urllib.request.urlopen(url,timeout=30).read();(out/f'page-{i+1:02d}.png').write_bytes(raw);im=Image.open(io.BytesIO(raw)).convert('RGB')
              assert im.size==(600,600)
              colors=im.crop((0,0,300,600));mask=im.crop((300,0,600,600));r,g,b=mask.split()
              assert not ImageChops.difference(r,g).getbbox() and not ImageChops.difference(r,b).getbbox()
              rgb.extend(colors.tobytes());alpha.extend(r.tobytes())
          (out/'pixels.rgb').write_bytes(rgb);(out/'pixels.alpha').write_bytes(alpha)
          m=json.loads(Path('assets/weekly-boss/akainu/manifest.json').read_text());clips=[]
          for action in ['idle','walk','hurt','punch','aoe']:
              c=m['clips'][action]['south'];clips.append((action,c['size']*c['frames'],c['size']*4,c['size'],c['frames'],4))
          c=m['vfx'];clips.append(('magma-area',c['size']*6,c['size']*4,c['size'],6,4))
          offset=0;contact=Image.new('RGB',(1200,1280),(40,45,52));draw=ImageDraw.Draw(contact)
          for row,(name,w,h,size,cols,rows) in enumerate(clips):
              n=w*h;im=Image.frombytes('RGB',(w,h),bytes(rgb[offset*3:(offset+n)*3])).convert('RGBA');im.putalpha(Image.frombytes('L',(w,h),bytes(alpha[offset:offset+n])));offset+=n;im.save(out/(name+'.png'))
              print('SHEET',name,'size',im.size,'offset',offset-n)
              for direction in range(rows):
                  a=im.crop((0,direction*size,size,(direction+1)*size));print(' frame',direction,a.getchannel('A').getbbox())
                  a.thumbnail((180,180),Image.Resampling.NEAREST);contact.paste(a,(direction*200+20,row*210+25),a)
              draw.text((820,row*210+50),name,fill='white')
          print('Nonzero remainder',sum(a!=0 for a in alpha[offset:]),'offset',offset,'stream',len(alpha))
          p=Path('tools/akainu-recovery-contact.png');contact.save(p)
          PY
      - name: Registrar somente imagem de revisao, nunca os arquivos de producao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/akainu-recovery-contact.png
          git commit -m 'chore: expose recovered sprite contact sheet for alignment review'
          git push origin HEAD:feature/akainu-weekly-boss
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akainu-native-recovery-evidence
          path: /tmp/akainu-native
          retention-days: 7
