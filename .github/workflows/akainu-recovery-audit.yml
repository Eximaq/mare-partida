name: Akainu - auditoria da recuperacao
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-recovery-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Encontrar fronteira de transporte valida sem executar fontes
        run: |
          python3 - <<'PY'
          import base64,zlib,re,json,hashlib
          from pathlib import Path
          v=[p.read_text().strip() for p in sorted(Path('tools').glob('akainu-source-part*.txt'))]
          correction=Path('tools/akainu-source-correction.txt').read_text().strip()
          v[1]=v[1][:v[1].rfind(correction[:4])]+correction
          out=Path('/tmp/akainu-audit');out.mkdir()
          successes=[]
          for offset in range(9000,len(v[1])-1):
              text=v[0]+v[1][:offset]+v[1][offset+2:]+v[2]+v[3]
              try:
                  data=base64.b64decode(text,validate=True);d=zlib.decompressobj(31);raw=d.decompress(data);s=raw.decode('utf8')
              except (zlib.error,UnicodeError,ValueError):continue
              chunks=re.split(r'(?=^diff --git )',s,flags=re.M)
              if len(chunks)<25:continue
              successes.append({'offset':offset,'bytes':len(raw),'files':len(chunks)-1,'complete':d.eof,'sha256':hashlib.sha256(raw).hexdigest()})
              (out/f'candidate-{offset}.patch').write_bytes(raw)
              print('CANDIDATE',successes[-1]);print('FILES',[c.splitlines()[0] for c in chunks if c.strip()]);print('TAIL',s[-300:])
          (out/'candidates.json').write_text(json.dumps(successes,indent=2))
          print('CANDIDATES',len(successes))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: akainu-source-audit
          path: /tmp/akainu-audit
          retention-days: 1
