name: Dawn manual — jogo e capturas
on:
  pull_request:
    branches: [main]
    paths:
      - 'dawn-*.js'
      - 'game.js'
      - 'world-system.js'
      - 'assets/dawn-manual/**'
      - 'tests/dawn_manual_browser.py'
      - 'tools/build_pages.py'
      - '.github/workflows/dawn-manual-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
# New PR revisions supersede older runs; main/deploy jobs are never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dawn:
    runs-on: ubuntu-latest
    # A cold Chromium/system-dependency install exceeded ten minutes in PR57.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-1.63.0
      - name: Preparar Chromium e build
        run: |
          python -m pip install playwright==1.63.0
          bash tools/install_ci_chromium.sh python -m playwright
          python tools/build_pages.py
      - name: Conferir jogo e capturar o pacote estático
        env:
          MARE_TEST_URL: http://127.0.0.1:8123/dist/
        run: |
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/dawn-server.log 2>&1 &
          sleep 2
          python tests/dawn_manual_browser.py
      - name: Capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dawn-manual-capturas
          path: docs/evidence-dawn-manual/after/
          if-no-files-found: warn
          retention-days: 14
