name: Akainu - evento semanal
on:
  push:
    branches: [feature/akainu-weekly-boss, main]
    paths: ['akainu-*', 'weekly-boss-*', 'world-battle.cjs', 'apps/**', 'packages/shared/**', 'tests/**', 'assets/weekly-boss/**', '.github/workflows/akainu-weekly.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: akainu-weekly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node --test tests/akainu-*.test.cjs tests/weekly-boss-*.test.cjs
  weekly:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: mare_test_admin
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mare_test_admin -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mare_test_admin:disposable-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: node --import tsx --test tests/foundation/weekly-boss-protocol.test.mts
      - run: node --import tsx --test --test-concurrency=1 tests/integration/server-weekly-boss.test.mts
