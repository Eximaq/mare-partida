name: Talentos — ícones, seleção e zoom
on:
  pull_request:
    branches: [main]
    paths:
      - 'talent-ui.js'
      - 'talents-hd.css'
      - 'assets/ui/talents-hd/**'
      - 'tests/talent-hd.test.cjs'
      - 'talent-system.js'
      - 'ui-system.js'
      - 'ui-screens.css'
      - 'ui-components.css'
      - 'ui-navigator.css'
      - 'ui-nautical.css'
      - 'game.js'
      - 'index.html'
      - 'assets/ui/talents/**'
      - 'tests/talent-canvas.test.cjs'
      - 'tests/talent_canvas_browser.py'
      - 'tests/talent_visual_browser.py'
      - 'tests/polish_support.py'
      - '.github/workflows/talents-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  talents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARE_TALENT_EVIDENCE: /tmp/mare-talent-visual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Validar talentos e pacote público
        run: |
          node --test tests/talent-system.test.cjs tests/talent-canvas.test.cjs tests/talent-hd.test.cjs tests/achievements-ultimates.test.cjs tests/ui-system.test.cjs
          python tools/build_pages.py
          python -m http.server 8123 --bind 127.0.0.1 > /tmp/mare-talent-http.log 2>&1 &
          sleep 2
          MARE_TEST_URL=http://127.0.0.1:8123/ python -X utf8 tests/talent_canvas_browser.py
          MARE_TEST_URL=http://127.0.0.1:8123/dist/ python -X utf8 tests/talent_visual_browser.py
      - name: Capturas da árvore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: talentos-icones-selecao-zoom
          path: /tmp/mare-talent-visual/
          if-no-files-found: warn
          retention-days: 14
