name: Akainu - conferir bordas e frames
on:
  push:
    branches: [feature/akainu-weekly-boss]
    paths: [.github/workflows/akainu-frame-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: akainu-native-recovery-evidence
          run-id: 42394219633
          github-token: ${{ github.token }}
          path: /tmp/native
      - run: pip install Pillow
      - name: Medir opacidade e limites dos quadros recuperados
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json,collections
          m=json.loads(Path('assets/weekly-boss/akainu/manifest.json').read_text())
          for action in ['idle','walk','hurt','punch','aoe','magma-area']:
              c=m['vfx'] if action=='magma-area' else m['clips'][action]['south'];size=c['size'];cols=c.get('columns',c['frames']);rows=4
              im=Image.open('/tmp/native/'+action+'.png').convert('RGBA');print('\nACTION',action)
              for row in range(rows):
                  for col in range(cols):
                      a=im.getchannel('A').crop((col*size,row*size,(col+1)*size,(row+1)*size));edge=[]
                      for box in [(0,0,size,1),(0,size-1,size,size),(0,0,1,size),(size-1,0,size,size)]:edge.extend(a.crop(box).tobytes())
                      if max(edge)>0:print('EDGE',row,col,'max',max(edge),'values',collections.Counter(v for v in edge if v),'bounds',[(t,a.point(lambda x:255 if x>=t else 0).getbbox()) for t in [1,8,32,128,240]])
          PY
