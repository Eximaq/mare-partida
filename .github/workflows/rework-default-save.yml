name: Rework — save padrão real
on:
  pull_request:
    branches: [main]
    paths:
      - 'player-rework-*hd*'
      - 'paper-doll-96-lobby.js'
      - 'game.js'
      - 'tests/rework_default_game_browser.cjs'
      - '.github/workflows/rework-default-save.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  default-save-world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: python tools/materialize_native_indexes.py
      - run: node --test player-rework-default-hd.test.cjs
      - name: Build real Pages and install browser
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          bash tools/install_ci_chromium.sh npx playwright
          python tools/build_pages.py
          python -m http.server 8157 --bind 127.0.0.1 > "$RUNNER_TEMP/default-rework-server.txt" 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8157/dist/ > /dev/null
      - name: New and restored saves, unchanged equipment, desktop and mobile
        env:
          MARE_TEST_URL: http://127.0.0.1:8157/dist/
          MARE_EVIDENCE_DIR: artifacts/rework-default-game
        run: node tests/rework_default_game_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rework-default-save-real-world
          path: artifacts/rework-default-game/
          if-no-files-found: warn
