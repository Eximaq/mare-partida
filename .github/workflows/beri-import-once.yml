name: Importar patch Beri na branch de trabalho
on:
  push:
    branches: [feature/beri-esferas-vfx]
    paths: [tools/beri-import-ready]
permissions:
  contents: write
concurrency:
  group: beri-import-once
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/feature/beri-esferas-vfx'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Aplicar somente o patch visual preparado
        run: |
          test -f tools/beri-import-ready
          test -f assets/akuma/beri-skill-sheet-v2.webp
          test -f assets/akuma/beri-skill-icon-v2.webp
          git apply --check tools/beri-visual-v2.patch
          git apply tools/beri-visual-v2.patch
          node --check game.js
          node --check akuma-system.js
          node --test tests/beri-visual-v2.test.cjs
          git diff --check
      - name: Registrar fontes aplicadas na mesma branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js akuma-system.js
          git rm tools/beri-visual-v2.patch tools/beri-import-ready
          git commit -m 'feat: integrate Beri six-sphere visual without changing combat rules'
          git push origin HEAD:feature/beri-esferas-vfx
